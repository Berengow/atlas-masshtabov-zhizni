"}},{"id":"paramec","n":"Инфузория-туфелька","en":"Paramecium caudatum","c":"pro","d":"Покрыта тысячами ресничек, которые бьют волнами. Есть «рот», пищеварительные вакуоли и два ядра — большое и малое.","f":["Сократительные вакуоли-«звёздочки» откачивают лишнюю воду каждые несколько секунд."],"wiki":"https://en.wikipedia.org/wiki/Paramecium_caudatum","v":{"t":"paramecium"},"w":0.00025,"h":9.259259259259259e-05,"ph":{"src":"img/w_paramec.jpg","w":720,"h":547,"artist":"Deuterostome","license":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Paramecium_caudatum_Ehrenberg,_1833.jpg","wiki":"https://en.wikipedia.org/wiki/Paramecium_caudatum","file":"Paramecium_caudatum_Ehrenberg,_1833.jpg"}},{"id":"foram","n":"Фораминифера","en":"Foraminifera","c":"pro","d":"Протист в многокамерной известковой раковине, из пор которой тянутся тонкие нити-псевдоподии.","f":["Пирамиды Гизы сложены из известняка с раковинами гигантских фораминифер-нуммулитов."],"wiki":"https://en.wikipedia.org/wiki/Foraminifera","v":{"t":"foram"},"w":0.0005,"h":0.00045454545454545455,"ph":{"src":"img/w_foram.jpg","w":459,"h":309,"artist":"Scott Fay","license":"CC BY 2.5","page":"https://commons.wikimedia.org/wiki/File:Ammonia_tepida.jpg","wiki":"https://en.wikipedia.org/wiki/Foraminifera","file":"Ammonia_tepida.jpg"}},{"id":"amoeba","n":"Амёба протей","en":"Amoeba proteus","c":"pro","d":"Постоянно меняет форму, выпуская ложноножки, которыми ползёт и охватывает добычу.","f":["По некоторым оценкам, геном отдельных амёб в сотни раз больше человеческого."],"wiki":"https://en.wikipedia.org/wiki/Amoeba_proteus","v":{"t":"amoeba"},"w":0.0005,"h":0.0003846153846153846,"ph":{"src":"img/w_amoeba.jpg","w":720,"h":553,"artist":"SmallRex","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Amoeba_proteus_with_many_pseudopodia.jpg","wiki":"https://en.wikipedia.org/wiki/Amoeba_proteus","file":"Amoeba_proteus_with_many_pseudopodia.jpg"}},{"id":"noct","n":"Ночесветка","en":"Noctiluca scintillans","c":"pro","d":"Крупный динофлагеллят-пузырь. При механическом раздражении светится голубым — от неё «горит» море у берега.","f":["Название означает «мерцающий ночной свет»."],"wiki":"https://en.wikipedia.org/wiki/Noctiluca_scintillans","v":{"t":"noctiluca"},"w":0.0008,"h":0.0008,"ph":{"src":"img/w_noct.jpg","w":400,"h":265,"artist":"Maria Antónia Sampayo, Instituto de Oceanografia, Faculdade Ciências da Unive…","license":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:Noctiluca_scintillans_varias.jpg","wiki":"https://en.wikipedia.org/wiki/Noctiluca_scintillans","file":"Noctiluca_scintillans_varias.jpg"}},{"id":"volvox","n":"Вольвокс","en":"Volvox","c":"pro","d":"Шар-колония из тысяч жгутиковых клеток, внутри которого растут дочерние шары. Модель перехода от одноклеточности к многоклеточности.","f":["Шар вращается, загребая тысячами жгутиков согласованно."],"wiki":"https://en.wikipedia.org/wiki/Volvox","v":{"t":"volvox"},"w":0.001,"h":0.001,"ph":{"src":"img/w_volvox.jpg","w":720,"h":480,"artist":"Frank Fox","license":"CC BY-SA 3.0 de","page":"https://commons.wikimedia.org/wiki/File:Mikrofoto.de-volvox-4.jpg","wiki":"https://en.wikipedia.org/wiki/Volvox","file":"Mikrofoto.de-volvox-4.jpg"}},{"id":"stentor","n":"Трубач","en":"Stentor coeruleus","c":"pro","d":"Инфузория-гигант в форме трубы до 2 мм длиной. Ядро вытянуто в цепочку бусин.","f":["Даже маленький фрагмент клетки трубача может вырасти в целую клетку."],"wiki":"https://en.wikipedia.org/wiki/Stentor_(ciliate)","v":{"t":"stentor"},"w":0.0009000000000000001,"h":0.002,"ph":{"src":"img/w_stentor.jpg","w":576,"h":359,"artist":"Public domainPublic domainfalsefalse This work has been released into the pub…","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Stentor_roeseli_composite_image.jpg","wiki":"https://en.wikipedia.org/wiki/Stentor_%28ciliate%29","file":"Stentor_roeseli_composite_image.jpg"}},{"id":"acetab","n":"Ацетабулярия","en":"Acetabularia","c":"pro","d":"Морская абудки","en":"Myosotis pollen","c":"fun","d":"Одно из самых мелких пыльцевых зёрен среди растений, всего несколько микрометров.","f":["Пыльцевое зерно — это мужской «гаметофит», крошечное растение из двух-трёх клеток."],"v":{"t":"pollen","kind":"smooth"},"w":5e-06,"h":3.125e-06},{"id":"yeast","n":"Пекарские дрожжи","en":"Saccharomyces cerevisiae","c":"fun","d":"Одноклеточный гриб, размножающийся почкованием. Сбраживает сахар в спирт и углекислый газ — так поднимается тесто и бродит пиво.","f":["Около трети генов дрожжей имеют родственников в геноме человека."],"wiki":"https://en.wikipedia.org/wiki/Saccharomyces_cerevisiae","v":{"t":"yeast"},"w":6e-06,"h":4.285714285714286e-06,"ph":{"src":"img/w_yeast.jpg","w":720,"h":465,"artist":"Mogana Das Murtey and Patchamuthu Ramasamy","license":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:Saccharomyces_cerevisiae_SEM.jpg","wiki":"https://en.wikipedia.org/wiki/Saccharomyces_cerevisiae","file":"Saccharomyces_cerevisiae_SEM.jpg"}},{"id":"stoma","n":"Устьице","en":"Stoma","c":"fun","d":"Пора в кожице листа между двумя замыкающими клетками-«губами». Через устьица лист дышит и испаряет воду.","f":["На квадратном миллиметре листа бывает несколько сотен устьиц."],"wiki":"https://en.wikipedia.org/wiki/Stoma","v":{"t":"stoma"},"w":3e-05,"h":2.5e-05,"ph":{"src":"img/w_stoma.jpg","w":703,"h":720,"artist":"Photohound","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Tomato_leaf_stomate_1-color.jpg","wiki":"https://en.wikipedia.org/wiki/Stoma","file":"Tomato_leaf_stomate_1-color.jpg"}},{"id":"sunfl","n":"Пыльца подсолнечника","en":"Helianthus pollen","c":"fun","d":"Шипастое пыльцевое зерно: шипы помогают цепляться к пушку насекомых-опылителей.","f":["Узор поверхности пыльцы настолько специфичен, что по нему определяют растение — этим занимается палинология."],"v":{"t":"pollen","kind":"spiky"},"w":3.5e-05,"h":3.5e-05},{"id":"penic","n":"Кисточка пеницилла","en":"Penicillium conidiophore","c":"fun","d":

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Атлас масштабов жизни">
<meta property="og:description" content="От атома водорода до гигантской грибницы: 262 объекта в одном масштабе, с 3D-моделями и фотографиями.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Атлас масштабов жизни</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Интерактивная шкала размеров живого: от атома водорода до гигантской грибницы. Атомы, аминокислоты, белки, вирусы, клетки и организмы с 3D-моделями и фотографиями.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Oranienbaum&display=swap">
<style>
/* Layout: one full-bleed microscope stage (canvas) under floating instrument chrome;
   a slide-out specimen card on the right (bottom sheet on phones). Light = brightfield H&E slide,
   dark = fluorescence channels (DAPI / GFP / MitoTracker). */
:root{
  --bg:#f3f1f6; --bg2:#e9e5ef; --ink:#221b2f; --ink2:#62587a; --line:#d8d0e3;
  --panel:#fbfafc; --glass:rgba(251,250,252,.88); --accent:#6a3db3; --accent-ink:#ffffff; --accent-soft:#ece4f8;
  --font-display:"Oranienbaum","Didot","Bodoni 72","Times New Roman",serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
  /* stage stains */
  --k-bg:#f3f1f6; --k-grid:#8b7fa6; --k-ground:#6b5d86; --k-ink:#2a2138; --k-ink2:#6c6284;
  --k-mem:#9c3f70; --k-cyto:#f2c6d7; --k-cyto2:#e3a2bf; --k-nuc:#5b3c95; --k-nuc2:#3f2574; --k-nucl:#26134f;
  --k-gpos:#5a2c90; --k-gneg:#da5a8c; --k-green:#4d8c3b; --k-green2:#2e6826; --k-mito:#c95679; --k-mito2:#8e2c52;
  --k-vir:#56688c; --k-vir2:#97a5c4; --k-rna:#c0533a; --k-lipid:#efd38a; --k-red:#d4425a; --k-red2:#a42a42;
  --k-gold:#c98323; --k-silica:#4f8aa1; --k-sil:#3a3050; --k-golgi:#3a281d; --k-glow:#6a3db3;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#060914; --bg2:#0c1222; --ink:#e3e8f7; --ink2:#8e97b6; --line:#1d2742;
  --panel:#0a0f1f; --glass:rgba(9,13,27,.84); --accent:#47cfff; --accent-ink:#04121c; --accent-soft:#0f2638;
  --k-bg:#060914; --k-grid:#5d74b8; --k-ground:#7f93d0; --k-ink:#e3e8f7; --k-ink2:#8e97b6;
  --k-mem:#39e88b; --k-cyto:#0f3a2b; --k-cyto2:#15553f; --k-nuc:#2f5cff; --k-nuc2:#6f8fff; --k-nucl:#c3cfff;
  --k-gpos:#b27dff; --k-gneg:#ff5eae; --k-green:#ff4d4d; --k-green2:#ff8f80; --k-mito:#ff7a3c; --k-mito2:#ffb27e;
  --k-vir:#ffcc47; --k-vir2:#fff0a6; --k-rna:#ff5fd2; --k-lipid:#ffe26b; --k-red:#ff3d63; --k-red2:#ff8ba1;
  --k-gold:#ffb347; --k-silica:#6ff0ff; --k-sil:#c7d2f6; --k-golgi:#8affc0; --k-glow:#47cfff;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#060914; --bg2:#0c1222; --ink:#e3e8f7; --ink2:#8e97b6; --line:#1d2742;
  --panel:#0a0f1f; --glass:rgba(9,13,27,.84); --accent:#47cfff; --accent-ink:#04121c; --accent-soft:#0f2638;
  --k-bg:#060914; --k-grid:#5d74b8; --k-ground:#7f93d0; --k-ink:#e3e8f7; --k-ink2:#8e97b6;
  --k-mem:#39e88b; --k-cyto:#0f3a2b; --k-cyto2:#15553f; --k-nuc:#2f5cff; --k-nuc2:#6f8fff; --k-nucl:#c3cfff;
  --k-gpos:#b27dff; --k-gneg:#ff5eae; --k-green:#ff4d4d; --k-green2:#ff8f80; --k-mito:#ff7a3c; --k-mito2:#ffb27e;
  --k-vir:#ffcc47; --k-vir2:#fff0a6; --k-rna:#ff5fd2; --k-lipid:#ffe26b; --k-red:#ff3d63; --k-red2:#ff8ba1;
  --k-gold:#ffb347; --k-silica:#6ff0ff; --k-sil:#c7d2f6; --k-golgi:#8affc0; --k-glow:#47cfff;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{position:fixed;inset:0;overflow:hidden;overflow:clip}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#stage.hover{cursor:pointer}

/* top bar */
.bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand-name{font-family:var(--font-display);font-size:26px;line-height:1;letter-spacing:.01em;white-space:nowrap}
.brand-sub{font-family:var(--font-mono);font-size:11px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.bar-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px;flex:none}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.icon{width:36px;padding:0;justify-content:center}

/* chapter track */
.track{position:absolute;z-index:4;left:0;right:0;top:calc(58px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.track-row{position:relative;display:flex;gap:2px;height:8px;cursor:pointer;touch-action:none}
.seg{flex:1 1 0;border-radius:2px;background:var(--seg);opacity:.35;transition:opacity .2s}
.seg.on{opacity:1}
.track-marker{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);border-radius:1px;pointer-events:none;transform:translateX(-1px)}
.track-meta{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--ink2);letter-spacing:.04em}
.track-meta b{color:var(--ink);font-weight:600}

/* scale instruments */
.scale{position:absolute;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
  font-family:var(--font-mono);font-size:12px;color:var(--ink2);display:grid;gap:4px;pointer-events:none}
.scale-bar{height:6px;border:2px solid var(--ink);border-top:0;width:100px}
.scale-lbl{color:var(--ink);font-weight:600;font-size:13px}

/* caption */
.caption{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(640px,calc(100% - 2 * max(16px,env(safe-area-inset-left,0px))));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:14px 14px;transition:opacity .25s}
.caption.hide{opacity:0;pointer-events:none}
.nav-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav-btn svg{width:18px;height:18px}
.cap-body{min-width:0;display:grid;gap:2px}
.eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);min-width:0}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--chap,var(--accent));flex:none}
.eyebrow .chap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow .idx{margin-left:auto;white-space:nowrap}
.cap-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.cap-name{font-family:var(--font-display);font-size:34px;line-height:1.08;margin:2px 0 0;font-weight:400;text-wrap:balance}
.cap-size{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.cap-en{font-size:13px;color:var(--ink2);font-style:italic}
.cap-lead{margin:4px 0 0;font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap-more{justify-self:start;margin-top:8px;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;cursor:pointer}

.hint{position:absolute;z-index:3;left:50%;top:calc(112px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:13px;color:var(--ink2);
  background:var(--glass);border:1px solid var(--line);padding:6px 14px;border-radius:999px;white-space:nowrap;transition:opacity .6s;pointer-events:none}
.hint.gone{opacity:0}

/* detail panel */
.panel{position:absolute;z-index:8;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;transform:translateX(102%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.panel.open{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s}
.p-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px 20px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);min-width:0}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--chap,var(--accent));flex:none}
.chip span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-nav{margin-left:auto;display:flex;gap:4px}
.p-nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center}
.p-nav button:hover{border-color:var(--accent)}
.p-nav svg{width:16px;height:16px}
.p-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 20px 28px;display:grid;grid-auto-rows:max-content;gap:18px;align-content:start}
.p-title h2{font-family:var(--font-display);font-weight:400;font-size:38px;line-height:1.05;margin:0;text-wrap:balance}
.p-en{color:var(--ink2);font-style:italic;font-size:14px;margin-top:4px}
.p-size{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px}
.p-size .v{font-family:var(--font-mono);font-weight:600;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.p-size .n{font-size:13px;color:var(--ink2)}
.media{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.m-tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:var(--bg2)}
.m-tabs button{flex:1;height:30px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink2)}
.m-tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.m-view{position:relative;height:300px}
.m-view>*{position:absolute;inset:0}
#v3d{touch-action:none}
#v3d canvas{outline:none}
.m-photo{margin:0;display:flex;flex-direction:column;background:#fff}
.m-photo img{flex:1;min-height:0;width:100%;object-fit:contain;background:#fff}
.m-photo figcaption{font-size:11px;color:#5d5470;padding:6px 10px;background:#f6f4f8;border-top:1px solid #e3dcec;line-height:1.35}
.m-photo figcaption a{color:inherit}
#mDraw{width:100%;height:100%;display:block}
.m-tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border-top:1px solid var(--line);background:var(--bg2);align-items:center}
.m-tools button{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12px}
.m-tools button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.m-tools .note{font-size:11.5px;color:var(--ink2);margin-left:auto}
.m-status{display:grid;place-items:center;font-size:13px;color:var(--ink2);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-family:var(--font-mono);font-size:11px;color:var(--ink2);padding:8px 10px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.p-desc{margin:0;font-size:15.5px;line-height:1.6;max-width:65ch}
.p-sec h3{margin:0 0 8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.facts li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.5}
.facts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--accent)}
.props{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;margin:0;font-size:14px}
.props dt{color:var(--ink2)}
.props dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
.codons{display:flex;flex-wrap:wrap;gap:4px}
.codons span{font-family:var(--font-mono);font-size:12px;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--ink)}
.cmp-list{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.cmp-list b{font-family:var(--font-mono);font-weight:600;color:var(--accent)}
.cmp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmp-row select{flex:1;min-width:0;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;padding:0 8px}
#cmpCanvas{width:100%;height:200px;display:block;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--bg)}
.cmp-text{font-size:14px;margin:8px 0 0}
.src{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}
.src a{color:var(--accent)}
.src .muted{color:var(--ink2)}

/* catalog */
.catalog{position:absolute;z-index:10;inset:0;background:var(--bg);display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.catalog.open{opacity:1;visibility:visible;transition:opacity .25s,visibility 0s}
.cat-head{display:grid;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.cat-top{display:flex;gap:10px;align-items:center}
.cat-top h2{font-family:var(--font-display);font-weight:400;font-size:30px;margin:0;line-height:1}
.cat-count{font-family:var(--font-mono);font-size:12px;color:var(--ink2)}
.cat-search{flex:1;min-width:0;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;padding:0 16px;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chips button{flex:none;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chips button i{width:7px;height:7px;border-radius:50%;background:var(--chap)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat-body{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.cat-group{margin-bottom:22px}
.cat-group h3{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.cat-group h3 i{width:10px;height:10px;border-radius:50%;background:var(--chap)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;text-align:left;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-width:0}
.card:hover{border-color:var(--accent)}
.card canvas{width:52px;height:52px;display:block}
.card b{display:block;font-weight:600;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.card small{font-family:var(--font-mono);font-size:11.5px;color:var(--ink2)}
.cat-empty{color:var(--ink2);padding:30px 0}

@media (max-width:860px){
  .brand-sub{display:none}
  .btn .lbl{display:none}
  .btn{width:36px;padding:0;justify-content:center}
}
@media (max-width:760px){
  .bar{gap:8px}
  .bar-actions{gap:4px}
  .btn,.btn.icon{width:34px;height:34px}
  .brand{min-width:0;flex:1 1 auto}
  .brand-name{font-size:17px;overflow:hidden;text-overflow:ellipsis}
  .track{top:calc(52px + env(safe-area-inset-top,0px))}
  .track-meta .blurb,#trackFov,#gridLbl{display:none}
  .scale{bottom:auto;top:calc(90px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px}
  .hint{top:calc(122px + env(safe-area-inset-top,0px));font-size:12px;white-space:normal;text-align:center;width:max-content;max-width:calc(100% - 32px)}
  .caption{grid-template-columns:1fr;padding:12px 14px}
  .caption .nav-btn{display:none}
  .cap-name{font-size:28px}
  .cap-lead{-webkit-line-clamp:2}
  .cap-actions{display:flex;gap:8px;align-items:center}
  .panel{top:auto;height:88%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(102%);padding-right:0}
  .p-title h2{font-size:32px}
  .m-view{height:260px}
}
.cap-actions{display:flex;gap:8px;align-items:center;margin-top:8px}
.cap-actions .cap-more{margin-top:0}
.cap-actions .mob{display:none}
@media (max-width:760px){ .cap-actions .mob{display:grid;width:32px;height:32px} }
@media (prefers-reduced-motion: reduce){ .panel,.catalog,.caption,.hint{transition:none} }
</style>
</head>
<body>

<div class="app" id="app">
  <canvas id="stage" role="img" aria-label="Шкала размеров живого: объекты, нарисованные в одном масштабе"></canvas>

  <header class="bar">
    <div class="brand"><span class="brand-name">Атлас масштабов жизни</span><span class="brand-sub" id="brandSub">от атома до грибницы</span></div>

<script type="application/json" id="data">{"chapters":[{"id":"atoms","name":"Атомы жизни","blurb":"Кислород, углерод, водород и азот дают 96% массы тела. Остальное — щепотка других элементов, без которых жизнь невозможна."},{"id":"mol","name":"Простые молекулы","blurb":"Несколько атомов — и уже вода, воздух, сигнальные газы."},{"id":"aa","name":"Аминокислоты","blurb":"Двадцать «букв», которыми клетка пишет все свои белки, и ещё две редкие."},{"id":"sug","name":"Сахара","blurb":"Топливо, строительный материал и скелет нуклеиновых кислот."},{"id":"nuc","name":"Нуклеотиды и коферменты","blurb":"Буквы генетического кода и переносчики энергии."},{"id":"lip","name":"Липиды, стероиды, пигменты","blurb":"Мембраны, запасы энергии и молекулы, поглощающие свет."},{"id":"sig","name":"Нейромедиаторы и гормоны","blurb":"Маленькие молекулы, которыми клетки разговаривают друг с другом."},{"id":"vit","name":"Витамины","blurb":"Вещества, которые организм не может сделать сам, но без которых не работают ферменты."},{"id":"eve","name":"Молекулы повседневности","blurb":"Кофе, шоколад, лекарства и пряности — на уровне атомов."},{"id":"prot","name":"Белки и молекулярные машины","blurb":"Цепочки аминокислот, свёрнутые в насосы, моторы, ножницы и фабрики."},{"id":"vir","name":"Вирусы","blurb":"Генетическая программа в белковой упаковке. От 17 нанометров до размеров бактерии."},{"id":"org","name":"Внутри клетки","blurb":"Органеллы и каркас — «органы» и «скелет» клетки."},{"id":"bac","name":"Бактерии и археи","blurb":"Самые древние и самые многочисленные жители планеты."},{"id":"hum","name":"Клетки человека","blurb":"Около 30 триллионов клеток двух сотен типов."},{"id":"pro","name":"Протисты и водоросли","blurb":"Одноклеточные эукариоты: охотники, фотосинтетики и гиганты размером с ладонь."},{"id":"fun","name":"Грибы, пыльца, растения","blurb":"Споры, пыльцевые зёрна и самое маленькое цветковое растение."},{"id":"mic","name":"Микроживотные","blurb":"Многоклеточные существа, которых трудно разглядеть без лупы."},{"id":"ani","name":"Животные и великаны","blurb":"От двухграммовой летучей мыши до гриба площадью с город."}],"items":[{"id":"h","n":"Водород","en":"Hydrogen · H","c":"atoms","d":"Самый лёгкий и самый распространённый элемент во Вселенной: один протон и один электрон. В теле водород входит в воду и почти во все органические молекулы. По числу атомов он лидер — около 62% всех атомов организма.","f":["Ядра водорода в вашем теле образовались в первые минуты после Большого взрыва: им около 13,8 млрд лет.","По массе водорода в теле всего ~10%: он очень лёгкий."],"p":{"Z":1,"mass":1.008,"conf":"1s¹","shells":[1],"body":"≈ 10%"},"v":{"t":"atom","z":1,"sym":"H"},"w":2.4e-10,"h":2.4e-10},{"id":"zn","n":"Цинк","en":"Zinc · Zn","c":"atoms","d":"Входит в сотни ферментов и в «цинковые пальцы» — белковые мотивы, которыми регуляторы читают ДНК. Важен для иммунитета и заживления ран.","f":["При оплодотворении яйцеклетка выбрасывает миллиарды ионов цинка — «цинковую искру» видно во флуоресцентный микроскоп."],"p":{"Z":30,"mass":65.38,"conf":"[Ar] 3d¹⁰ 4s²","shells":[2,8,18,2],"body":"≈ 0,003%"},"v":{"t":"atom","z":30,"sym":"Zn"},"w":2.78e-10,"h":2.78e-10},{"id":"o","n":"Кислород","en":"Oxygen · O","c":"atoms","d":"Самый массовый элемент тела — около 65%, в основном в составе воды. В митохондриях кислород принимает электроны в конце дыхательной цепи, и это даёт клетке большую часть энергии.","f":["Каждый второй атом кислорода, которым вы дышите, выработан фотосинтезом в океане."],"p":{"Z":8,"mass":15.999,"conf":"[He] 2s² 2p⁴","shells":[2,6],"body":"≈ 65%"},"v":{"t":"atom","z":8,"sym":"O"},"w":3.04e-10,"h":3.04e-10},{"id":"n","n":"Азот","en":"Nitrogen · N","c":"atoms","d":"Обязательная часть аминокислот и нуклеотидов. Воздух на 78% состоит из азота, но ни растения, ни животные не умеют брать его напрямую: его «связывают» бактерии.","f":["По оценкам, около половины атомов азота в вашем теле прошли через заводской синтез аммиака по методу Габера — Боша."],"p":{"Z":7,"mass":14.007,"conf":"[He] 2s² 2p³","shells":[2,5],"body":"≈ 3,2%"},"v":{"t":"atom","z":7,"sym":"N"},"w":3.1e-10,"h":3.1e-10},{"id":"c","n":"Углерод","en":"Carbon · C","c":"atoms","d":"Основа органической химии. Четыре связи позволяют углероду строить цепи, кольца и разветвлённые скелеты любой сложности — от сахаров до ДНК.","f":["Углерод вашего тела был синтезирован в недрах давно погибших звёзд.","Если убрать воду, углерод составит около половины сухой массы тела."],"p":{"Z":6,"mass":12.011,"conf":"[He] 2s² 2p²","shells":[2,4],"body":"≈ 18,5%"},"v":{"t":"atom","z":6,"sym":"C"},"w":3.4e-10,"h":3.4e-10},{"id":"mg","n":"Магний","en":"Magnesium · Mg","c":"atoms","d":"Нужен более чем 300 ферментам. Почти весь АТФ в клетке существует в комплексе с ионом магния. В центре молекулы хлорофилла тоже сидит атом магния.","f":["В теле взрослого около 25 г магния, больше половины — в костях."],"p":{"Z":12,"mass":24.305,"conf":"[Ne] 3s²","shells":[2,8,2],"body":"≈ 0,05%"},"v":{"t":"atom","z":12,"sym":"Mg"},"w":3.46e-10,"h":3.46e-10},{"id":"cl","n":"Хлор","en":"Chlorine · Cl","c":"atoms","d":"Главный отрицательный ион вне клеток: вместе с натрием определяет солёность крови. В желудке хлор входит в состав соляной кислоты.","f":["Желудок выделяет до двух литров кислого желудочного сока в сутки."],"p":{"Z":17,"mass":35.45,"conf":"[Ne] 3s² 3p⁵","shells":[2,8,7],"body":"≈ 0,2%"},"v":{"t":"atom","z":17,"sym":"Cl"},"w":3.5e-10,"h":3.5e-10},{"id":"p","n":"Фосфор","en":"Phosphorus · P","c":"atoms","d":"Остов ДНК и РНК — это чередование сахара и фосфата. Фосфор входит в АТФ, в фосфолипиды мембран и в минерал костей гидроксиапатит.","f":["В теле взрослого около 700 г фосфора, 85% из них — в костях и зубах.","Фосфор открыли в 1669 году, выпаривая мочу."],"p":{"Z":15,"mass":30.974,"conf":"[Ne] 3s² 3p³","shells":[2,8,5],"body":"≈ 1%"},"v":{"t":"atom","z":15,"sym":"P"},"w":3.6e-10,"h":3.6e-10},{"id":"s","n":"Сера","en":"Sulfur · S","c":"atoms","d":"Есть в аминокислотах цистеине и метионине. Дису img/p_ins.webp","w":393,"h":374},"v":{"t":"img"},"w":3.5e-09,"h":3.3307888040712468e-09,"pdbid":"4INS","pdb":"pdb/4INS.pdb","pdbbb":false},{"id":"ubq","n":"Убиквитин","en":"Ubiquitin","c":"prot","d":"Маленький белок-метка из 76 аминокислот. Цепочка убиквитинов, пришитая к белку, отправляет его на уничтожение в протеасому.","f":["Название означает «вездесущий» — он есть во всех клетках эукариот.","Его последовательность у человека и дрожжей отличается всего тремя аминокислотами."],"wiki":"https://en.wikipedia.org/wiki/Ubiquitin","pi":{"src":"img/p_ubq.webp","w":270,"h":394},"v":{"t":"img"},"w":2.467005076142132e-09,"h":3.6e-09,"pdbid":"1UBQ","pdb":"pdb/1UBQ.pdb","pdbbb":false},{"id":"dna","n":"Двойная спираль ДНК","en":"B-DNA","c":"prot","d":"Два сахарофосфатных остова, а между ними — пары оснований. Один виток — 10,5 пары, 3,4 нм.","f":["Если вытянуть ДНК одной клетки человека в линию, получится около 2 метров.","ДНК всех ядерных клеток тела, вытянутая в одну нить, протянулась бы на миллиарды километров — дальше орбиты Плутона."],"sd":"фрагмент из 12 пар оснований; диаметр спирали 2 нм","wiki":"https://en.wikipedia.org/wiki/DNA","pi":{"src":"img/p_dna.webp","w":223,"h":476},"v":{"t":"img"},"w":1.873949579831933e-09,"h":4e-09,"pdbid":"1BNA","pdb":"pdb/1BNA.pdb","pdbbb":true},{"id":"gfp","n":"Зелёный флуоресцентный белок","en":"GFP","c":"prot","d":"Белок медузы Aequorea victoria. «Бочонок» из 11 β-тяжей прячет внутри светящуюся группу, которая сама собирается из трёх аминокислот.","f":["GFP «пришивают» к другим белкам и смотрят, где они работают в живой клетке. Нобелевская премия 2008 года."],"wiki":"https://en.wikipedia.org/wiki/Green_fluorescent_protein","pi":{"src":"img/p_gfp.webp","w":315,"h":416},"v":{"t":"img"},"w":3.180288461538462e-09,"h":4.2e-09,"pdbid":"1EMA","pdb":"pdb/1EMA.pdb","pdbbb":false},{"id":"lyz","n":"Лизоцим","en":"Lysozyme","c":"prot","d":"Фермент слёз, слюны и яичного белка, который разрушает клеточные стенки бактерий.","f":["Лизоцим открыл Александр Флеминг в 1922 году — за шесть лет до пенициллина.","Это первый фермент, чью трёхмерную структуру расшифровали (1965)."],"wiki":"https://en.wikipedia.org/wiki/Lysozyme","pi":{"src":"img/p_lyz.webp","w":261,"h":416},"v":{"t":"img"},"w":2.8233173076923075e-09,"h":4.5e-09,"pdbid":"1LYZ","pdb":"pdb/1LYZ.pdb","pdbbb":false},{"id":"mb","n":"Миоглобин","en":"Myoglobin","c":"prot","d":"Запасает кислород в мышцах. Одна цепь из 153 аминокислот и один гем.","f":["Миоглобин — первый белок, чья 3D-структура была расшифрована (Джон Кендрю, 1958).","У китов и тюленей миоглобина так много, что их мышцы почти чёрные."],"wiki":"https://en.wikipedia.org/wiki/Myoglobin","pi":{"src":"img/p_mb.webp","w":415,"h":417},"v":{"t":"img"},"w":4.4784172661870505e-09,"h":4.5e-09,"pdbid":"1MBN","pdb":"pdb/1MBN.pdb","pdbbb":false},{"id":"hb","n":"Гемоглобин","en":"Hemoglobin","c":"prot","d":"Четыре субъединицы, в каждой — гем с атомом железа. Связав одну молекулу кислорода, гемоглобин легче связывает следующие.","f":["В одном эритроците около 270 миллионов молекул гемоглобина.","Его структуру расшифровал Макс Перуц после 22 лет работы."],"wiki":"https://en.wikipedia.org/wiki/Hemoglobin","pi":{"src":"img/p_hb.webp","w":442,"h":444},"v":{"t":"img"},"w":6.470720720720721e-09,"h":6.5e-09,"pdbid":"4HHB","pdb":"pdb/4HHB.pdb","pdbbb":false},{"id":"aqp","n":"Аквапорин","en":"Aquaporin-1","c":"prot","d":"Водный канал в мембране. Пропускает молекулы воды гуськом, по одной, и не пропускает протоны.","f":["Один канал пропускает до 3 миллиардов молекул воды в секунду.","Нобелевская премия по химии 2003 года."],"wiki":"https://en.wikipedia.org/wiki/Aquaporin","pi":{"src":"img/p_aqp.webp","w":399,"h":399},"v":{"t":"img"},"w":7e-09,"h":7e-09,"pdbid":"1J4N","pdb":"pdb/1J4N.pdb","pdbbb":false},{"id":"rho","n":"Родопсин","en":"Rhodopsin","c":"prot","d":"Светочувствительный белок палочек сетчатки. Семь спиралей пронизывают мембрану, а внутри лежит ретиналь. Фотон меняет форму ретиналя, и запускается зрительный сигнал.","f":["Ретиналь делается из витамина A."],"wiki":"https://en.wikipedia.org/wiki/Rhodopsin","pi":{"src":"img/p_rho.webp","w":470,"h":444},"v":{"t":"img"},"w":7.5e-09,"h":7.085106382978723e-09,"pdbid":"1F88","pdb":"pdb/1F88.pdb","pdbbb":false},{"id":"kcsa","n":"Калиевый канал","en":"KcsA potassium channel","c":"prot","d":"Пропускает ионы калия в 10 000 раз охотнее, чем натрия, хотя ион натрия меньше. Секрет — в «фильтре» из атомов кислорода, точно подогнанном под калий.","f":["Структуру канала расшифровал Родерик Маккиннон в 1998 году — Нобелевская премия 2003 года."],"wiki":"https://en.wikipedia.org/wiki/Potassium_channel","pi":{"src":"img/p_kcsa.webp","w":326,"h":413},"v":{"t":"img"},"w":6.3147699757869256e-09,"h":8e-09,"pdbid":"1BL8","pdb":"pdb/1BL8.pdb","pdbbb":false},{"id":"tub","n":"Тубулин","en":"Tubulin dimer","c":"prot","d":"Пара α- и β-тубулина — «кирпичик» микротрубочек. Из 13 рядов таких кирпичиков собирается полая трубка.","f":["Яд колхицин и противоопухолевый таксол действуют именно на тубулин."],"wiki":"https://en.wikipedia.org/wiki/Tubulin","pi":{"src":"img/p_tub.webp","w":284,"h":434},"v":{"t":"img"},"w":5.235023041474655e-09,"h":8e-09,"pdbid":"1TUB","pdb":"pdb/1TUB.pdb","pdbbb":false},{"id":"nuc1","n":"Нуклеосома","en":"Nucleosome","c":"prot","d":"147 пар оснований ДНК, намотанные почти на два оборота вокруг восьми белков-гистонов. Так 2 метра ДНК умещаются в ядре размером 6 мкм.","f":["Гистоны — одни из самых консервативных белков: у гороха и коровы они почти одинаковы."],"wiki":"https://en.wikipedia.org/wiki/Nucleosome","pi":{"src":"img/p_nuc1.webp","w":381,"h":306},"v":{"t":"img"},"w":1.1e-08,"h":8.834645669291337e-09,"pdbid":"1KX5","pdb":"pdb/1KX5.pdb","pdbbb":true},{"id":"rbc8","n":"РуБисКО","en":"RuBisCO","c":"prot","d":"Фермент, который связывает CO₂ при фотосинтезе, — вероятно, самый распространённый белок на Земле. Работает медленно: несколько реакций в секунду, поэтому растениям нужно его очень много.","f":["До половины растворимого iki/Adeno-associated_virus","pi":{"src":"img/p_aav.webp","w":426,"h":417},"v":{"t":"img"},"w":2.5e-08,"h":2.447183098591549e-08,"pdbid":"1LP3","ph":{"src":"img/w_aav.jpg","w":720,"h":671,"artist":"Jazzlw","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Adeno-associated_virus_serotype_AAV2.jpg","wiki":"https://en.wikipedia.org/wiki/Adeno-associated_virus","file":"Adeno-associated_virus_serotype_AAV2.jpg"}},{"id":"polio","n":"Полиовирус","en":"Poliovirus","c":"vir","d":"Возбудитель полиомиелита. Благодаря вакцинации дикий полиовирус остался лишь в немногих странах.","f":["В 2002 году полиовирус впервые синтезировали «с нуля», по одной лишь последовательности генома."],"wiki":"https://en.wikipedia.org/wiki/Poliovirus","pi":{"src":"img/p_polio.webp","w":453,"h":450},"v":{"t":"img"},"w":3e-08,"h":2.9801324503311256e-08,"pdbid":"2PLV","ph":{"src":"img/w_polio.jpg","w":223,"h":245,"artist":"","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Polio.jpg","wiki":"https://en.wikipedia.org/wiki/Poliovirus","file":"Polio.jpg"}},{"id":"rhino","n":"Риновирус","en":"Rhinovirus","c":"vir","d":"Главная причина простуды. Лучше всего размножается при 33–35 °C — как раз в носу.","f":["Известно более 160 типов риновирусов, поэтому вакцины от простуды нет."],"wiki":"https://en.wikipedia.org/wiki/Rhinovirus","pi":{"src":"img/p_rhino.webp","w":426,"h":427},"v":{"t":"img"},"w":2.992974238875878e-08,"h":3e-08,"pdbid":"4RHV","ph":{"src":"img/w_rhino.jpg","w":720,"h":695,"artist":"Thomas Splettstoesser (www.scistyle.com)","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Rhinovirus_isosurface.png","wiki":"https://en.wikipedia.org/wiki/Rhinovirus","file":"Rhinovirus_isosurface.png"}},{"id":"noro","n":"Норовирус","en":"Norovirus","c":"vir","d":"Возбудитель «желудочного гриппа» и вспышек на круизных лайнерах.","f":["Для заражения хватает нескольких десятков вирусных частиц."],"wiki":"https://en.wikipedia.org/wiki/Norovirus","p ловек.","f":["Корь стирает «иммунную память» о ранее перенесённых инфекциях."],"wiki":"https://en.wikipedia.org/wiki/Measles_morbillivirus","v":{"t":"env","spikes":"pin","inner":"rnp"},"w":1.5e-07,"h":1.5e-07,"ph":{"src":"img/w_measles.jpg","w":715,"h":720,"artist":"Photo Credit: Cynthia S. Goldsmith Content Providers(s): CDC/ Courtesy of Cyn…","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Measles_virus.JPG","wiki":"https://en.wikipedia.org/wiki/Measles_morbillivirus","file":"Measles_virus.JPG"}},{"id":"rabies","n":"Вирус бешенства","en":"Rabies lyssavirus","c":"vir","d":"Вирус в форме пули. Ползёт по нервам к мозгу, поэтому вакцину успевают ввести уже после укуса.","f":["Первую вакцину против бешенства применил Луи Пастер в 1885 году."],"sd":"75 × 180 нм","wiki":"https://en.wikipedia.org/wiki/Rabies_lyssavirus","v":{"t":"bullet"},"w":1.8e-07,"h":7.5e-08,"ph":{"src":"img/w_rabies.jpg","w":720,"h":720,"artist":"NIAID - https://www.niaid.nih.gov/ - @ flikr","license":"CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:Rabies_Virus_(51706598561).jpg","wiki":"https://en.wikipedia.org/wiki/Rabies_lyssavirus","file":"Rabies_Virus_(51706598561).jpg"}},{"id":"hsv","n":"Вирус герпеса","en":"Herpes simplex virus","c":"vir","d":"Икосаэдрический капсид, слой белков-тегумента и оболочка. Прячется в нервных узлах и пробуждается при стрессе или простуде.","f":["Вирусом простого герпеса заражены более половины взрослых людей мира."],"wiki":"https://en.wikipedia.org/wiki/Herpes_simplex_virus","v":{"t":"env","spikes":"pin","inner":"icosa","tegument":true},"w":2e-07,"h":2e-07,"ph":{"src":"img/w_hsv.jpg","w":639,"h":500,"artist":"CDC/Dr. Erskine Palmer","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Herpes_simplex_virus_TEM_B82-0474_lores.jpg","wiki":"https://en.wikipedia.org/wiki/Herpes_simplex_virus","file":"Herpes_simplex_virus_TEM_B82-0474_lores.jpg"}},{"id":"t4phage","n":"Бактериофаг T4","en":"Escherichia virus T4","c":"vir","d":"Вирус бактерий, похожий на посадочный модуль: головка с ДНК, хвост-шприц и ножки. Прокалывает стенку кишечной палочки и впрыскивает геном.","f":["Фагов на Земле около 10³¹ — больше, чем звёзд во Вселенной."],"wiki":"https://en.wikipedia.org/wiki/Escherichia_virus_T4","v":{"t":"phage"},"w":9e-08,"h":2e-07,"ph":{"src":"img/w_t4phage.jpg","w":295,"h":337,"artist":"7USSR7","license":"CC BY 4.0","page":"https://commons.wikimedia.org/wiki/File:T4_phage_EM.jpg","wiki":"https://en.wikipedia.org/wiki/Escherichia_virus_T4","file":"T4_phage_EM.jpg"}},{"id":"tmv","n":"Вирус табачной мозаики","en":"Tobacco mosaic virus","c":"vir","d":"Палочка из 2130 одинаковых белков, уложенных спиралью вокруг РНК. Первый открытый вирус.","f":["Вирусы открыл русский учёный Дмитрий Ивановский в 1892 году, изучая болезнь табака."],"sd":"300 × 18 нм","wiki":"https://en.wikipedia.org/wiki/Tobacco_mosaic_virus","v":{"t":"rodv"},"w":3e-07,"h":1.7964071856287425e-08,"ph":{"src":"img/w_tmv.jpg","w":560,"h":720,"artist":"Unknown authorUnknown author","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:TobaccoMosaicVirus.jpg","wiki":"https://en.wikipedia.org/wiki/Tobacco_mosaic_virus","file":"TobaccoMosaicVirus.jpg"}},{"id":"pox","n":"Вирус натуральной оспы","en":"Variola virus","c":"vir","d":"Крупный кирпичеобразный вирус. Натуральная оспа — первая и пока единственная болезнь человека, полностью побеждённая вакцинацией.","f":["Последний естественный случай оспы зарегистрирован в 1977 году в Сомали."],"sd":"около 300 × 250 нм","wiki":"https://en.wikipedia.org/wiki/Variola_virus","v":{"t":"brick"},"w":3e-07,"h":2.5e-07,"ph":{"src":"img/w_pox.jpg","w":661,"h":720,"artist":"Content Providers(s): CDC/ Dr. Fred Murphy; Sylvia Whitfield","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Smallpox_virus_virions_TEM_PHIL_1849.JPG","wiki":"https://en.wikipedia.org/wiki/Variola_virus","file":"Smallpox_virus_virions_TEM_PHIL_1849.JPG"}},{"id":"mimi","n":"Мимивирус","en":"Mimivirus","c":"vir","d":"Гигантский вирус амёб, покрытый слоем волокон. Его так долго принимали за бактерию, что назвали «мимикрирующим микробом».","f":["У мимивируса около 1000 генов — больше, чем у некоторых бактерий.","У мимивирусов есть собственные вирусы-паразиты — вирофаги, например «Спутник»."],"sd":"капсид около 400 нм, с волокнами ~750 нм","wiki":"https://en.wikipedia.org/wiki/Mimivirus","v":{"t":"giantv"},"w":7.5e-07,"h":7.5e-07,"ph":{"src":"img/w_mimi.jpg","w":466,"h":455,"artist":"Sarah Duponchel and Matthias G. Fischer","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Giant_Mimivirus_with_satellite_Sputnik_virophages.png","wiki":"https://en.wikipedia.org/wiki/Mimivirus","file":"Giant_Mimivirus_with_satellite_Sputnik_virophages.png"}},{"id":"ebola","n":"Вирус Эбола","en":"Orthoebolavirus zairense","c":"vir","d":"Нитевидный вирус, часто загнутый крючком или кольцом. Вызывает тяжёлую геморрагическую лихорадку.","f":["Назван по реке Эбола в Демократической Республике Конго."],"sd":"толщина 80 нм, длина около 1 мкм","wiki":"https://en.wikipedia.org/wiki/Ebola","v":{"t":"filo"},"w":9.7e-07,"h":1.6166666666666667e-07,"ph":{"src":"img/w_ebola.jpg","w":720,"h":332,"artist":"CDC/Cynthia Goldsmith","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Ebola_virus_virion.jpg","wiki":null,"file":"Ebola virus virion.jpg"}},{"id":"pandora","n":"Пандоравирус","en":"Pandoravirus","c":"vir","d":"Вирус-гигант в форме амфоры с порой на вершине. Больше 90% его генов не похожи ни на что известное.","f":["Назван в честь ящика Пандоры: его открытие задало множество новых вопросов."],"sd":"около 1 × 0,5 мкм","wiki":"https://en.wikipedia.org/wiki/Pandoravirus","v":{"t":"amphora"},"w":1e-06,"h":6.249999999999999e-07,"ph":{"src":"img/w_pandora.jpg","w":720,"h":620,"artist":"Matthieu Legendre, Elisabeth Fabre, Olivier Poirot, Sandra Jeudy, Audrey Lart…","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:41467_2018_4698_Fig1_HTML_Pandoraviruses.jpg","wiki":"https://en.wikipedia.org/wiki/Pandoravirus","file":"41467_2018_4698_Fig1_HTML_Pandoraviruses.jpg"}},{"id":"pitho","n":"Питовирус","en":"Pithovirus sibericum","c":"vir","d":"Самый крупный из известных вирусов. Найден в 30-тысячелетней вечной мерзлоте Чукотки — и после разморозки всё ещё заражал амёб.","f":["Длиннее многих бактерий и виден в обычный световой микроскоп."],"sd":"около 1,5 × 0,5 мкм","wiki":"https://en.wikipedia.org/wiki/Pithovirus","v":{"t":"amphora","cork":true},"w":1.5e-06,"h":8.333333333333333e-07,"ph":{"src":"img/w_pitho.jpg","w":526,"h":323,"artist":"Pavel Hrdlička (Czech Wikipedia user Packa)","license":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Pithovirus_sibericum_sketch.jpg","wiki":"https://en.wikipedia.org/wiki/Pithovirus","file":"Pithovirus_sibericum_sketch.jpg"}},{"id":"svesicle","n":"Синаптический пузырёк","en":"Synaptic vesicle","c":"org","d":"Пузырёк мембраны диаметром ~40 нм, наполненный нейромедиатором. При импульсе сливается с мембраной и выпускает содержимое в синапс.","f":["В одном пузырьке — несколько тысяч молекул нейромедиатора."],"wiki":"https://en.wikipedia.org/wiki/Synaptic_vesicle","v":{"t":"vesicle"},"w":4e-08,"h":4e-08,"ph":{"src":"img/w_svesicle.jpg","w":571,"h":720,"artist":"vectorization: Mouagip (talk) Synapse_diag1.png: Drawn by fr:Utilisateur:Dake…","license":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Synapse_diag1.svg","wiki":"https://en.wikipedia.org/wiki/Synaptic_vesicle","file":"Synapse_diag1.svg"}},{"id":"actin","n":"Актиновый филамент","en":"Actin filament","c":"org","d":"Двойная спираль из глобулярных белков актина. Вместе с миозином сокращает мышцы и двигает «ножки» ползущих клеток.","f":["Актин — один из самых обильных белков в клетках эукариот."],"sd":"толщина 7 нм; фрагмент 100 нм","wiki":"https://en.wikipedia.org/wiki/Microfilament","v":{"t":"actin"},"w":1e-07,"h":7.142857142857142e-09,"ph":{"src":"img/w_actin.jpg","w":600,"h":450,"artist":"Y tambe","license":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:MEF_microfilaments.jpg","wiki":"https://en.wikipedia.org/wiki/Microfilament","file":"MEF_microfilaments.jpg"}},{"id":"npc","n":"Ядерная пора","en":"Nuclear pore complex","c":"org","d":"Ворота в ядерной оболочке с восьмилучевой симметрией. Собраны примерно из 1000 белков около 30 видов и пропускают сотни молекул в секунду.","f":["В ядре клетки человека — 2000–4000 пор."],"wiki":"https://en.wikipedia.org/wiki/Nuclear_pore","v":{"t":"pore"},"w":1.2e-07,"h":1.2e-07,"ph":{"src":"img/w_npc.jpg","w":720,"h":590,"artist":"Mariana Ruiz LadyofHats","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Diagram_human_cell_nucleus_multilang.svg","wiki":"https://en.wikipedia.org/wiki/Nuclear_pore","file":"Diagram_human_cell_nucleus_multilang.svg"}},{"id":"mt","n":"Микротрубочка","en":"Microtubule","c":"org","d":"Полая трубка из 13 рядов тубулина — «рельсы», по которым моторные белки возят грузы, и нити веретена деления.","f":["Микротрубочки постоянно растут и разбираются — это называют «динамической нестабильностью»."],"sd":"диаметр 25 нм; фрагмент 400 нм","wiki":"https://en.wikipedia.org/wiki/Microtubule","v":{"t":"mt"},"w":4e-07,"h":2.5e-08,"ph":{"src":"img/w_mt.jpg","w":720,"h":405,"artist":"PKS615","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Tubulin_Infographic.jpg","wiki":"https://en.wikipedia.org/wiki/Microtubule","file":"Tubulin_Infographic.jpg"}},{"id":"centr","n":"Центриоль","en":"Centriole","c":"org","d":"Цилиндр из девяти троек микротрубочек. Пара центриолей организует веретено деления и основания ресничек.","f":["Из центриоли вырастает базальное тельце жгутика сперматозоида."],"sd":"250 × 500 нм","wiki":"https://en.wikipedia.org/wiki/Centriole","v":{"t":"centriole"},"w":2.5e-07,"h":5e-07,"ph":{"src":"img/w_centr.jpg","w":720,"h":504,"artist":"BruceBlaus","license":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:Blausen_0214_Centrioles.png","wiki":"https://en.wikipedia.org/wiki/Centriole","file":"Blausen_0214_Centrioles.png"}},{"id":"lyso","n":"Лизосома","en":"Lysosome","c":"org","d":"Пузырёк с кислой средой (pH ~4,5) и десятками пищеварительных ферментов — «желудок» клетки.","f":["Открывший лизосомы Кристиан де Дюв получил Нобелевскую премию в 1974 году."],"wiki":"https://en.wikipedia.org/wiki/Lysosome","v":{"t":"lyso"},"w":5e-07,"h":5e-07,"ph":{"src":"img/w_lyso.jpg","w":720,"h":416,"artist":"Kelvinsong","license":"CC0","page":"https://commons.wikimedia.org/wiki/File:Animal_Cell.svg","wiki":"https://en.wikipedia.org/wiki/Lysosome","file":"Animal_Cell.svg"}},{"id":"perox","n":"Пероксисома","en":"Peroxisome","c":"org","d":"Органелла, где окисляются длинные жирные кислоты и обезвреживается перекись водорода.","f":["В пероксисомах часто видно кристаллическое ядро из фермента."],"wiki":"https://en.wikipedia.org/wiki/Peroxisome","v":{"t":"perox"},"w":6e-07,"h":6e-07,"ph":{"src":"img/w_perox.jpg","w":720,"h":720,"artist":"Original: Agateller Vector: Qef","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Peroxisome.svg","wiki":"https://en.wikipedia.org/wiki/Peroxisome","file":"Peroxisome.svg"}},{"id":"mito","n":"Митохондрия","en":"Mitochondrion","c":"org","d":"Энергостанция клетки: здесь кислород превращает энергию пищи в АТФ. У митохондрии свой кольцевой геном — наследство бактерии-предка.","f":["Митохондриальная ДНК передаётся только от матери.","В клетке сердечной мышцы митохондрии занимают около трети объёма."],"wiki":"https://en.wikipedia.org/wiki/Mitochondrion","v":{"t":"mito"},"w":2e-06,"h":8.333333333333333e-07,"ph":{"src":"img/w_mito.jpg","w":720,"h":494,"artist":"Mariana Ruiz Villarreal LadyofHats","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Animal_mitochondrion_diagram_en.svg","wiki":"https://en.wikipedia.org/wiki/Mitochondrion","file":"Animal_mitochondrion_diagram_en.svg"}},{"id":"golgi","n":"Аппарат Гольджи","en":"Golgi apparatus","c":"org","d":"Стопка уплощённых мешочков, где белки получают сахарные «ярлыки» и сортируются по адресам.","f":["Камилло Гольджи открыл его в 1898 году с помощью окраски серебром."],"wiki":"https://en.wikipedia.org/wiki/Golgi_apparatus","v":{"t":"golgi"},"w":3e-06,"h":2.142857142857143e-06,"ph":{"src":"img/w_golgi.jpg","w":720,"h":480,"artist":"explorebiology","license":"CC BY 4.0","page":"https://commons.wikimedia.org/wiki/File:XBio_illustration_%E2%80%93_Golgi_Apparatus.png","wiki":"https://en.wikipedia.org/wiki/Golgi_apparatus","file":"XBio_illustration_–_Golgi_Apparatus.png"}},{"id":"chloro","n":"Хлоропласт","en":"Chloroplast","c":"org","d":"Органелла фотосинтеза. Внутри — стопки мембранных дисков-тилакоидов с хлорофиллом. Как и митохондрия, хлоропласт — потомок бактерии, в его случае цианобактерии.","f":["В одной клетке листа может быть до сотни хлоропластов."],"wiki":"https://en.wikipedia.org/wiki/Chloroplast","v":{"t":"chloro"},"w":5e-06,"h":2.5e-06,"ph":{"src":"img/w_chloro.jpg","w":720,"h":599,"artist":"Chiswick Chap","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Chloroplast_II_(cropped).svg","wiki":"https://en.wikipedia.org/wiki/Chloroplast","file":"Chloroplast_II_(cropped).svg"}},{"id":"nucleus","n":"Ядро клетки","en":"Cell nucleus","c":"org","d":"Хранилище генома в двойной мембране с порами. Внутри — хроматин и ядрышко, где собираются рибосомы.","f":["Ядро открыл в 1831 году ботаник Роберт Броун — тот самый, в честь кого названо броуновское движение."],"wiki":"https://en.wikipedia.org/wiki/Cell_nucleus","v":{"t":"nucleus"},"w":6e-06,"h":5.4545454545454545e-06,"ph":{"src":"img/w_nucleus.jpg","w":459,"h":350,"artist":"TenOfAllTrades at English Wikipedia","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:HeLa_cells_stained_with_Hoechst_33258.jpg","wiki":"https://en.wikipedia.org/wiki/Cell_nucleus","file":"HeLa_cells_stained_with_Hoechst_33258.jpg"}},{"id":"chrom","n":"Хромосома","en":"Metaphase chromosome","c":"org","d":"Перед делением ДНК плотно упаковывается в X-образные хромосомы: две копии-хроматиды, соединённые центромерой.","f":["У человека 46 хромосом, а у папоротника ужовника — больше 1200."],"sd":"метафазная хромосома 1 — до ~8–10 мкм","wiki":"https://en.wikipedia.org/wiki/Chromosome","v":{"t":"chrom"},"w":4.4e-06,"h":8e-06,"ph":{"src":"img/w_chrom.jpg","w":720,"h":395,"artist":"Thomas Shafee","license":"CC BY 4.0","page":"https://commons.wikimedia.org/wiki/File:Chromosome_DNA_Gene_unannotated.svg","wiki":"https://en.wikipedia.org/wiki/Chromosome","file":"Chromosome_DNA_Gene_unannotated.svg"}},{"id":"myco","n":"Микоплазма","en":"Mycoplasma genitalium","c":"bac","d":"Одна из самых маленьких бактерий: без клеточной стенки, с геномом примерно из 500 генов.","f":["Именно на её геноме учёные отрабатывали создание «минимальной клетки»."],"wiki":"https://en.wikipedia.org/wiki/Mycoplasma_genitalium","v":{"t":"myco"},"w":3e-07,"h":2.3076923076923075e-07,"ph":{"src":"img/w_myco.jpg","w":720,"h":545,"artist":"Martina Maritan, Scripps Research","license":"CC BY 4.0","page":"https://commons.wikimedia.org/wiki/File:3D_Whole_Cell_(3D-WC)_model_of_a_Mycoplasma_genitalium_cell.jpg","wiki":"https://en.wikipedia.org/wiki/Mycoplasma_genitalium","file":"3D_Whole_Cell_(3D-WC)_model_of_a_Mycoplasma_genitalium_cell.jpg"}},{"id":"nanoarch","n":"Нанархеум","en":"Nanoarchaeum equitans","c":"bac","d":"Архея-«наездник» диаметром 0,4 мкм, живущая на поверхности другой археи в горячих источниках.","f":["Видовое название equitans означает «едущий верхом»."],"wiki":"https://en.wikipedia.org/wiki/Nanoarchaeum_equitans","v":{"t":"coccus","arr":"single","gram":"arch"},"w":4e-07,"h":4e-07,"ph":{"src":"img/w_nanoarch.jpg","w":220,"h":184,"artist":"Karl O. Stetter","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Urzwerg.jpg","wiki":"https://en.wikipedia.org/wiki/Nanoarchaeum_equitans","file":"Urzwerg.jpg"}},{"id":"pelagi","n":"Пелагибактер","en":"Pelagibacter ubique (SAR11)","c":"bac","d":"Крошечная бактерия открытого океана с одним из самых компактных геномов среди свободноживущих организмов.","f":["Вероятно, самый многочисленный организм на планете: порядка 10²⁸ клеток."],"sd":"около 0,15 × 0,6 мкм","wiki":"https://en.wikipedia.org/wiki/Pelagibacter","v":{"t":"vibrio","gram":"-","slim":true},"w":6e-07,"h":2e-07,"ph":{"src":"img/w_pelagi.jpg","w":500,"h":407,"artist":"Gulf of Alaska Seamounts 2019 Expedition","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Pelagibacter.jpg","wiki":"https://en.wikipedia.org/wiki/Pelagibacter","file":"Pelagibacter.jpg"}},{"id":"prochl","n":"Прохлорококк","en":"Prochlorococcus","c":"bac","d":"Самый маленький и самый многочисленный фотосинтезирующий организм. Открыт только в 1988 году.","f":["В миллилитре морской воды бывает больше 100 000 клеток прохлорококка."],"wiki":"https://en.wikipedia.org/wiki/Prochlorococcus","v":{"t":"coccus","arr":"single","gram":"cyano"},"w":6e-07,"h":6e-07,"ph":{"src":"img/w_prochl.jpg","w":697,"h":720,"artist":"Luke Thompson from Chisholm Lab and Nikki Watson from Whitehead, MIT","license":"CC0","page":"https://commons.wikimedia.org/wiki/File:Prochlorococcus_marinus.jpg","wiki":"https://en.wikipedia.org/wiki/Prochlorococcus","file":"Prochlorococcus_marinus.jpg"}},{"id":"ecoli","n":"Кишечная палочка","en":"Escherichia coli","c":"bac","d":"Палочка длиной 2 мкм — главный «рабочий организм» молекулярной биологии. Большинство штаммов безвредны и живут в кишечнике.","f":["В идеальных условиях делится каждые 20 минут.","Её жгутики вращаются моторами со скоростью до 100 оборотов в секунду."],"wiki":"https://en.wikipedia.org/wiki/Escherichia_coli","v":{"t":"rodb","gram":"-","flag":"peri"},"w":2e-06,"h":7.692307692307691e-07,"ph":{"src":"img/w_ecoli.jpg","w":720,"h":524,"artist":"Photo by Eric Erbe, digital colorization by Christopher Pooley, both of USDA,…","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:E_coli_at_10000x,_original.jpg","wiki":"https://en.wikipedia.org/wiki/Escherichia_coli","file":"E_coli_at_10000x,_original.jpg"}},{"id":"vibrio","n":"Холерный вибрион","en":"Vibrio cholerae","c":"bac","d":"Изогнутая палочка-запятая с одним жгутиком — одна из самых быстрых бактерий. Вызывает холеру.","f":["В 1854 году Джон Сноу остановил вспышку холеры в Лондоне, сняв ручку с заражённой колонки."],"wiki":"https://en.wikipedia.org/wiki/Vibrio_cholerae","v":{"t":"vibrio","gram":"-","flag":"polar"},"w":2.5e-06,"h":1.1363636363636364e-06,"ph":{"src":"img/w_vibrio.jpg","w":720,"h":563,"artist":"","license":"Copyrighted free use","page":"https://commons.wikimedia.org/wiki/File:Cholera_bacteria_SEM.jpg","wiki":"https://en.wikipedia.org/wiki/Vibrio_cholerae","file":"Cholera_bacteria_SEM.jpg"}},{"id":"staph","n":"Золотистый стафилококк","en":"Staphylococcus aureus","c":"bac","d":"Шарики, собранные в грозди (staphyle — «виноградная гроздь»). Живёт в носу у трети людей; бывает опасен, особенно устойчивые к антибиотикам штаммы.","f":["Именно культуру стафилококка «испортила» плесень в чашке Флеминга."],"sd":"клетка ~1 мкм, гроздь — несколько мкм","wiki":"https://en.wikipedia.org/wiki/Staphylococcus_aureus","v":{"t":"coccus","arr":"cluster","gram":"+"},"w":3e-06,"h":2.7272727272727272e-06,"ph":{"src":"img/w_staph.jpg","w":720,"h":554,"artist":"Content Providers(s): CDC/ Matthew J. Arduino, DRPH Photo Credit: Janice Hane…","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Staphylococcus_aureus_VISA_2.jpg","wiki":"https://en.wikipedia.org/wiki/Staphylococcus_aureus","file":"Staphylococcus_aureus_VISA_2.jpg"}},{"id":"hpylori","n":"Хеликобактер","en":"Helicobacter pylori","c":"bac","d":"Спиральная бактерия, которая живёт в кислом желудке, нейтрализуя кислоту вокруг себя. Вызывает гастрит и язву.","f":["Чтобы доказать это, Барри Маршалл выпил культуру хеликобактера. Нобелевская премия 2005 года."],"wiki":"https://en.wikipedia.org/wiki/Helicobacter_pylori","v":{"t":"spiral","gram":"-","flag":"tuft"},"w":3e-06,"h":8.571428571428571e-07,"ph":{"src":"img/w_hpylori.jpg","w":600,"h":400,"artist":"Yutaka Tsutsumi, M.D. Professor Department of Pathology Fujita Health Univers…","license":"Copyrighted free use","page":"https://commons.wikimedia.org/wiki/File:EMpylori.jpg","wiki":"https://en.wikipedia.org/wiki/Helicobacter_pylori","file":"EMpylori.jpg"}},{"id":"mtb","n":"Палочка Коха","en":"Mycobacterium tuberculosis","c":"bac","d":"Возбудитель туберкулёза в восковой оболочке, устойчивой ко многим воздействиям.","f":["Делится лишь раз в 16–20 часов, поэтому туберкулёз лечат месяцами.","Открыта Робертом Кохом в 1882 году."],"wiki":"https://en.wikipedia.org/wiki/Mycobacterium_tuberculosis","v":{"t":"rodb","gram":"+","flag":"none","curve":0.15,"waxy":true},"w":3e-06,"h":4.2857142857142857e-07,"ph":{"src":"img/w_mtb.jpg","w":700,"h":466,"artist":"Photo Credit: Content Providers(s): CDC/Dr. George Kubica","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:TB_Culture.jpg","wiki":"https://en.wikipedia.org/wiki/Mycobacterium_tuberculosis","file":"TB_Culture.jpg"}},{"id":"deino","n":"Деинококк","en":"Deinococcus radiodurans","c":"bac","d":"Чемпион по устойчивости к радиации: собирает разорванный на сотни кусков геном заново.","f":["Выдерживает дозу радиации, в тысячу раз превышающую смертельную для человека."],"sd":"тетрада ~3 мкм","wiki":"https://en.wikipedia.org/wiki/Deinococcus_radiodurans","v":{"t":"coccus","arr":"tetrad","gram":"+"},"w":3e-06,"h":3e-06,"ph":{"src":"img/w_deino.jpg","w":532,"h":612,"artist":"Credit: TEM of D. radiodurans acquired in the laboratory of Michael Daly, Uni…","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Deinococcus_radiodurans.jpg","wiki":"https://en.wikipedia.org/wiki/Deinococcus_radiodurans","file":"Deinococcus_radiodurans.jpg"}},{"id":"bsub","n":"Сенная палочка","en":"Bacillus subtilis","c":"bac","d":"Почвенная палочка, которая при голоде образует спору, переживающую кипячение и высыхание.","f":["Спорами сенной палочки ферментируют японское блюдо натто."],"wiki":"https://en.wikipedia.org/wiki/Bacillus_subtilis","v":{"t":"rodb","gram":"+","flag":"peri","spore":true},"w":4e-06,"h":8e-07,"ph":{"src":"img/w_bsub.jpg","w":720,"h":540,"artist":"Allonweiner at English Wikipedia","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Bacillus_subtilis.jpg","wiki":"https://en.wikipedia.org/wiki/Bacillus_subtilis","file":"Bacillus_subtilis.jpg"}},{"id":"haloq","n":"Квадратная архея","en":"Haloquadratum walsbyi","c":"bac","d":"Плоская квадратная клетка из пересоленных прудов. Пузырьки газа внутри работают как поплавки.","f":["Клетки толщиной всего около 0,1–0,5 мкм похожи на почтовые марки."],"wiki":"https://en.wikipedia.org/wiki/Haloquadratum_walsbyi","v":{"t":"square"},"w":4e-06,"h":3.8095238095238094e-06,"ph":{"src":"img/w_haloq.jpg","w":357,"h":375,"artist":"Rotational","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Haloquadratum_walsbyi00.jpg","wiki":"https://en.wikipedia.org/wiki/Haloquadratum_walsbyi","file":"Haloquadratum_walsbyi00.jpg"}},{"id":"strep","n":"Стрептококк","en":"Streptococcus","c":"bac","d":"Шарики, выстроенные в цепочки. Среди стрептококков — возбудители ангины и молочнокислые бактерии йогурта.","f":["Streptococcus thermophilus вместе с болгарской палочкой превращает молоко в йогурт."],"sd":"клетка ~0,8 мкм, цепочки длиннее","wiki":"https://en.wikipedia.org/wiki/Streptococcus","v":{"t":"coccus","arr":"chain","gram":"+"},"w":5e-06,"h":1.25e-06,"ph":{"src":"img/w_strep.jpg","w":720,"h":443,"artist":"User:Graham Beards","license":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Streptococci.jpg","wiki":"https://en.wikipedia.org/wiki/Streptococcus","file":"Streptococci.jpg"}},{"id":"lacto","n":"Лактобактерия","en":"Lactobacillus","c":"bac","d":"Молочнокислые бактерии, которые сквашивают молоко, капусту и тесто на закваске.","f":["Кислая среда, которую создают лактобактерии, защищает продукт от других микробов."],"sd":"палочки 2–4 мкм в цепочках","wiki":"https://en.wikipedia.org/wiki/Lactobacillus","v":{"t":"rodchain","gram":"+"},"w":8e-06,"h":1.3333333333333332e-06,"ph":{"src":"img/w_lacto.jpg","w":625,"h":498,"artist":"Photo Credit: Janice Carr Content Providers(s): CDC/Dr. Mike Miller","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Lactobacillus_sp_01.png","wiki":"https://en.wikipedia.org/wiki/Lactobacillus","file":"Lactobacillus_sp_01.png"}},{"id":"trep","n":"Бледная трепонема","en":"Treponema pallidum","c":"bac","d":"Спирохета — тонкая спираль, ввинчивающаяся в ткани. Возбудитель сифилиса.","f":["Её так трудно вырастить вне организма, что первую стабильную культуру получили только в 2018 году."],"sd":"6–15 мкм × 0,15 мкм","wiki":"https://en.wikipedia.org/wiki/Treponema_pallidum","v":{"t":"spiro"},"w":1e-05,"h":2.5000000000000004e-07,"ph":{"src":"img/w_trep.jpg","w":531,"h":500,"artist":"Photo credit: Content providers(s): CDC / Dr. David Cox","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Treponema_pallidum.jpg","wiki":"https://en.wikipedia.org/wiki/Treponema_pallidum","file":"Treponema_pallidum.jpg"}},{"id":"anab","n":"Анабена","en":"Anabaena","c":"bac","d":"Цианобактерия-«бусы». Часть клеток превращается в гетероцисты — специализированные клетки, где фиксируется азот.","f":["Цианобактерии 2,4 млрд лет назад насытили атмосферу кислородом."],"sd":"нить из клеток по 3–5 мкм","wiki":"https://en.wikipedia.org/wiki/Anabaena","v":{"t":"filament"},"w":8e-05,"h":8.000000000000001e-06,"ph":{"src":"img/w_anab.jpg","w":307,"h":480,"artist":"","license":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Anabaena_sperica2.jpg","wiki":"https://en.wikipedia.org/wiki/Anabaena","file":"Anabaena_sperica2.jpg"}},{"id":"epulo","n":"Эпулописциум","en":"Epulopiscium fishelsoni","c":"bac","d":"Гигантская бактерия из кишечника рыб-хирургов, видимая невооружённым глазом. Хранит десятки тысяч копий своего генома.","f":["Рождает «детёнышей» внутри себя: дочерние клетки развиваются внутри материнской."],"sd":"до 0,6 мм","wiki":"https://en.wikipedia.org/wiki/Epulopiscium","v":{"t":"cigar"},"w":0.0006,"h":9.999999999999999e-05},{"id":"thion","n":"Тиомаргарита намибийская","en":"Thiomargarita namibiensis","c":"bac","d":"«Серная жемчужина Намибии»: шарообразные клетки цепочкой, как бусы. Большую часть клетки занимает вакуоль с нитратом.","f":["Блестит из-за гранул серы внутри."],"sd":"клетки 0,1–0,75 мм","wiki":"https://en.wikipedia.org/wiki/Thiomargarita_namibiensis","v":{"t":"pearls"},"w":0.00075,"h":0.00026785714285714287,"ph":{"src":"img/w_thion.jpg","w":336,"h":454,"artist":"NASA","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Sulphide_bacteria_crop.jpg","wiki":"https://en.wikipedia.org/wiki/Thiomargarita_namibiensis","file":"Sulphide_bacteria_crop.jpg"}},{"id":"thiomag","n":"Тиомаргарита великолепная","en":"Thiomargarita magnifica","c":"bac","d":"Крупнейшая известная бактерия, описанная в 2022 году. Одна клетка длиной до 2 см — размером с ресницу.","f":["Её ДНК упакована в мембранные мешочки — для бактерии это неслыханно."],"sd":"нить до 2 см","wiki":"https://en.wikipedia.org/wiki/Thiomargarita_magnifica","v":{"t":"longfil"},"w":0.02,"h":0.0003333333333333333,"ph":{"src":"img/w_thiomag.jpg","w":522,"h":720,"artist":"JEAN-MARIE VOLLAND","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Morphology_and_ultrastructure_of_Ca._T._magnifica.jpg","wiki":"https://en.wikipedia.org/wiki/Thiomargarita_magnifica","file":"Morphology_and_ultrastructure_of_Ca._T._magnifica.jpg"}},{"id":"plt","n":"Тромбоцит","en":"Platelet","c":"hum","d":"Безъядерный фрагмент клетки-гиганта мегакариоцита. При повреждении сосуда тромбоциты слипаются и затыкают брешь.","f":["Живут около 10 дней; в микролитре крови их 150–400 тысяч."],"wiki":"https://en.wikipedia.org/wiki/Platelet","v":{"t":"platelet"},"w":2.5e-06,"h":1.923076923076923e-06,"ph":{"src":"img/w_plt.jpg","w":720,"h":540,"artist":"Dr Graham Beards","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Platelets2.JPG","wiki":"https://en.wikipedia.org/wiki/Platelet","file":"Platelets2.JPG"}},{"id":"rbc","n":"Эритроцит","en":"Red blood cell","c":"hum","d":"Двояковогнутый диск без ядра, набитый гемоглобином. Протискивается сквозь капилляры уже собственного диаметра.","f":["Эритроциты — около 84% всех клеток тела по числу: примерно 25 триллионов.","Каждую секунду костный мозг делает около 2 миллионов новых эритроцитов."],"sd":"диаметр 7,5 мкм, толщина 2 мкм","wiki":"https://en.wikipedia.org/wiki/Red_blood_cell","v":{"t":"rbc"},"w":7.5e-06,"h":4.411764705882353e-06,"ph":{"src":"img/w_rbc.jpg","w":720,"h":720,"artist":"BruceBlaus","license":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:Blausen_0761_RedBloodCells.png","wiki":"https://en.wikipedia.org/wiki/Red_blood_cell","file":"Blausen_0761_RedBloodCells.png"}},{"id":"lymph","n":"Лимфоцит","en":"Lymphocyte","c":"hum","d":"Клетка приобретённого иммунитета: B-лимфоциты делают антитела, T-лимфоциты убивают заражённые клетки и командуют иммунным ответом.","f":["Клетки памяти могут жить десятилетиями и «помнят» встреченные инфекции."],"wiki":"https://en.wikipedia.org/wiki/Lymphocyte","v":{"t":"wbc","nuc":"round","gran":"none"},"w":8e-06,"h":8e-06,"ph":{"src":"img/w_lymph.jpg","w":720,"h":720,"artist":"NIAID/NIH","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Healthy_Human_T_Cell.jpg","wiki":"https://en.wikipedia.org/wiki/Lymphocyte","file":"Healthy_Human_T_Cell.jpg"}},{"id":"neut","n":"Нейтрофил","en":"Neutrophil","c":"hum","d":"Самые многочисленные лейкоциты и первые на месте инфекции. Поглощают бактерии и могут выбрасывать «сети» из собственной ДНК.","f":["Гной — это в основном погибшие нейтрофилы."],"wiki":"https://en.wikipedia.org/wiki/Neutrophil","v":{"t":"wbc","nuc":"lobed","gran":"fine"},"w":1.2e-05,"h":1.2e-05,"ph":{"src":"img/w_neut.jpg","w":720,"h":698,"artist":"Blausen Medical","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Blausen_0676_Neutrophil_(crop).png","wiki":"https://en.wikipedia.org/wiki/Neutrophil","file":"Blausen_0676_Neutrophil_(crop).png"}},{"id":"baso","n":"Базофил","en":"Basophil","c":"hum","d":"Самый редкий лейкоцит, меньше 1% от всех. Гранулы с гистамином и гепарином запускают аллергическую реакцию.","f":["Тёмно-синие гранулы базофила часто закрывают его ядро."],"wiki":"https://en.wikipedia.org/wiki/Basophil","v":{"t":"wbc","nuc":"bi","gran":"dark"},"w":1.2e-05,"h":1.2e-05,"ph":{"src":"img/w_baso.jpg","w":720,"h":698,"artist":"Blausen Medical","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Blausen_0077_Basophil_(crop).png","wiki":"https://en.wikipedia.org/wiki/Basophil","file":"Blausen_0077_Basophil_(crop).png"}},{"id":"eos","n":"Эозинофил","en":"Eosinophil","c":"hum","d":"Двухлопастное ядро и крупные гранулы, окрашивающиеся красным эозином. Борется с паразитами и участвует в аллергии.","f":["Назван по красителю эозину, а эозин — по греческой богине зари Эос."],"wiki":"https://en.wikipedia.org/wiki/Eosinophil","v":{"t":"wbc","nuc":"bi","gran":"red"},"w":1.3e-05,"h":1.3e-05,"ph":{"src":"img/w_eos.jpg","w":720,"h":698,"artist":"Blausen Medical","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Blausen_0352_Eosinophil_(crop).png","wiki":"https://en.wikipedia.org/wiki/Eosinophil","file":"Blausen_0352_Eosinophil_(crop).png"}},{"id":"mono","n":"Моноцит","en":"Monocyte","c":"hum","d":"Крупнейший лейкоцит крови с ядром в форме почки. Уходит из сосудов в ткани и превращается в макрофаг.","f":["В крови моноцит проводит всего 1–3 дня."],"wiki":"https://en.wikipedia.org/wiki/Monocyte","v":{"t":"wbc","nuc":"kidney","gran":"none"},"w":1.8e-05,"h":1.8e-05,"ph":{"src":"img/w_mono.jpg","w":720,"h":698,"artist":"Blausen Medical","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Blausen_0649_Monocyte_(crop).png","wiki":"https://en.wikipedia.org/wiki/Monocyte","file":"Blausen_0649_Monocyte_(crop).png"}},{"id":"macro","n":"Макрофаг","en":"Macrophage","c":"hum","d":"«Большой пожиратель» тканей: поглощает бактерии, погибшие клетки и мусор.","f":["Фагоцитоз открыл Илья Мечников в 1882 году, вонзая шипы розы в личинок морской звезды. Нобелевская премия 1908 года."],"wiki":"https://en.wikipedia.org/wiki/Macrophage","v":{"t":"macro"},"w":2.1e-05,"h":1.6153846153846154e-05,"ph":{"src":"img/w_macro.jpg","w":720,"h":413,"artist":"Mikael Häggström, M.D. Author info - Reusing images- Conflicts of interest: N…","license":"CC0","page":"https://commons.wikimedia.org/wiki/File:Cytology_of_a_macrophage.png","wiki":"https://en.wikipedia.org/wiki/Macrophage","file":"Cytology_of_a_macrophage.png"}},{"id":"hepat","n":"Гепатоцит","en":"Hepatocyte","c":"hum","d":"Клетка печени, химический завод организма: обезвреживает яды, синтезирует белки крови и запасает гликоген. Часто содержит два ядра.","f":["Печень может восстановиться, даже если удалить две трети её массы."],"wiki":"https://en.wikipedia.org/wiki/Hepatocyte","v":{"t":"hepato"},"w":2.5e-05,"h":2.173913043478261e-05,"ph":{"src":"img/w_hepat.jpg","w":461,"h":349,"artist":"","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Sinusoid.jpeg","wiki":"https://en.wikipedia.org/wiki/Hepatocyte","file":"Sinusoid.jpeg"}},{"id":"osteo","n":"Остеоцит","en":"Osteocyte","c":"hum","d":"Клетка, замурованная в кости, но связанная с соседями десятками тонких отростков. Чувствует нагрузку и управляет перестройкой кости.","f":["Остеоцит может жить десятилетиями."],"wiki":"https://en.wikipedia.org/wiki/Osteocyte","v":{"t":"osteo"},"w":5e-05,"h":3.3333333333333335e-05,"ph":{"src":"img/w_osteo.jpg","w":720,"h":631,"artist":"Source digital bitmap graphics: BDB Recreated in vector format: Nyq","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Transverse_section_of_bone_en.svg","wiki":"https://en.wikipedia.org/wiki/Osteocyte","file":"Transverse_section_of_bone_en.svg"}},{"id":"sperm","n":"Сперматозоид","en":"Spermatozoon","c":"hum","d":"Одна из самых маленьких клеток человека по объёму. Головка с ДНК, «шейка» из митохондрий и жгутик-мотор.","f":["Сперматозоиды образуются со скоростью около 1500 в секунду."],"sd":"головка 5 × 3 мкм, длина с хвостом ~55 мкм","wiki":"https://en.wikipedia.org/wiki/Sperm","v":{"t":"sperm"},"w":5.5e-05,"h":5e-06,"ph":{"src":"img/w_sperm.jpg","w":391,"h":265,"artist":"Unknown authorUnknown author","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Sperm-egg.jpg","wiki":"https://en.wikipedia.org/wiki/Sperm","file":"Sperm-egg.jpg"}},{"id":"cheek","n":"Клетка эпителия щеки","en":"Buccal epithelial cell","c":"hum","d":"Плоская многоугольная клетка, которую легко соскоблить ватной палочкой — так берут образцы ДНК.","f":["Эпителий рта полностью обновляется примерно за одну-две недели."],"v":{"t":"epith"},"w":6e-05,"h":5.454545454545454e-05},{"id":"mega","n":"Мегакариоцит","en":"Megakaryocyte","c":"hum","d":"Гигант костного мозга с огромным многолопастным ядром. Отшнуровывает от себя тысячи тромбоцитов.","f":["Ядро мегакариоцита содержит до 64 наборов хромосом."],"wiki":"https://en.wikipedia.org/wiki/Megakaryocyte","v":{"t":"mega"},"w":6e-05,"h":6e-05,"ph":{"src":"img/w_mega.jpg","w":720,"h":540,"artist":"WVSOM_Megakaryocytes.JPG: Wbensmith derivative work: Icewalker cs (talk)","license":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:WVSOM_Megakaryocytes_arrows.jpg","wiki":"https://en.wikipedia.org/wiki/Megakaryocyte","file":"WVSOM_Megakaryocytes_arrows.jpg"}},{"id":"fibro","n":"Фибробласт","en":"Fibroblast","c":"hum","d":"Клетка соединительной ткани, которая производит коллаген и межклеточный матрикс. Первой приходит заживлять рану.","f":["Именно фибробласты кожи чаще всего «перепрограммируют» в стволовые клетки."],"wiki":"https://en.wikipedia.org/wiki/Fibroblast","v":{"t":"fibro"},"w":8e-05,"h":2.5e-05,"ph":{"src":"img/w_fibro.jpg","w":720,"h":540,"artist":"SubtleGuest at English Wikipedia","license":"CC BY 2.5","page":"https://commons.wikimedia.org/wiki/File:NIH_3T3.jpg","wiki":"https://en.wikipedia.org/wiki/Fibroblast","file":"NIH_3T3.jpg"}},{"id":"cardio","n":"Кардиомиоцит","en":"Cardiomyocyte","c":"hum","d":"Клетка сердечной мышцы: поперечнополосатая, ветвящаяся, соединённая с соседями вставочными дисками. Сокращается всю жизнь без отдыха.","f":["Кардиомиоциты почти не обновляются: у взрослого — меньше 1% в год."],"wiki":"https://en.wikipedia.org/wiki/Cardiac_muscle_cell","v":{"t":"cardio"},"w":0.0001,"h":2.8571428571428574e-05,"ph":{"src":"img/w_cardio.jpg","w":720,"h":576,"artist":"Dr. S. Girod, Anton Becker","license":"CC BY 2.5","page":"https://commons.wikimedia.org/wiki/File:Glanzstreifen.jpg","wiki":"https://en.wikipedia.org/wiki/Cardiac_muscle_cell","file":"Glanzstreifen.jpg"}},{"id":"adipo","n":"Адипоцит","en":"Adipocyte","c":"hum","d":"Жировая клетка: почти весь объём занимает одна капля жира, а ядро прижато к краю.","f":["Число жировых клеток у взрослого почти постоянно: при похудении они уменьшаются, а не исчезают."],"wiki":"https://en.wikipedia.org/wiki/Adipocyte","v":{"t":"adipo"},"w":0.0001,"h":0.0001,"ph":{"src":"img/w_adipo.jpg","w":720,"h":576,"artist":"BruceBlaus","license":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:Blausen_0012_AdiposeTissue.png","wiki":"https://en.wikipedia.org/wiki/Adipocyte","file":"Blausen_0012_AdiposeTissue.png"}},{"id":"rodc","n":"Палочка сетчатки","en":"Rod cell","c":"hum","d":"Фоторецептор сумеречного зрения. Внешний сегмент — стопка из сотен мембранных дисков с родопсином.","f":["Палочка способна зарегистрировать единственный фотон.","В сетчатке около 120 миллионов палочек."],"sd":"толщина ~2 мкм, длина порядка 0,1 мм","wiki":"https://en.wikipedia.org/wiki/Rod_cell","v":{"t":"rodcell"},"w":6e-06,"h":0.0001,"ph":{"src":"img/w_rodc.jpg","w":720,"h":322,"artist":"Fig_retine.png: Ramón y Cajal derivative work Fig retine bended.png: Anka Fri…","license":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Retina-diagram.svg","wiki":"https://en.wikipedia.org/wiki/Rod_cell","file":"Retina-diagram.svg"}},{"id":"egg","n":"Яйцеклетка","en":"Oocyte","c":"hum","d":"Самая крупная клетка человека, окружённая прозрачной оболочкой. Её видно невооружённым глазом — как точку.","f":["Девочка рождается с запасом около миллиона незрелых яйцеклеток, а созревает за жизнь около 400."],"wiki":"https://en.wikipedia.org/wiki/Egg_cell","v":{"t":"egg"},"w":0.00012,"h":0.00012,"ph":{"src":"img/w_egg.jpg","w":500,"h":483,"artist":"Henry Vandyke Carter","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Gray3.png","wiki":"https://en.wikipedia.org/wiki/Egg_cell","file":"Gray3.png"}},{"id":"smooth","n":"Гладкомышечная клетка","en":"Smooth muscle cell","c":"hum","d":"Веретено без поперечной исчерченности. Сокращается медленно и долго: работает в стенках сосудов, кишечника, матки.","f":["В беременной матке гладкомышечные клетки удлиняются примерно в 10 раз."],"wiki":"https://en.wikipedia.org/wiki/Smooth_muscle","v":{"t":"smooth"},"w":0.0002,"h":1.4285714285714287e-05,"ph":{"src":"img/w_smooth.jpg","w":720,"h":309,"artist":"OpenStax","license":"CC BY 4.0","page":"https://commons.wikimedia.org/wiki/File:1029_Smooth_Muscle_Motor_Units.jpg","wiki":"https://en.wikipedia.org/wiki/Smooth_muscle","file":"1029_Smooth_Muscle_Motor_Units.jpg"}},{"id":"purk","n":"Клетка Пуркинье","en":"Purkinje cell","c":"hum","d":"Нейрон мозжечка с плоским веерообразным дендритным деревом. Отвечает за точность движений.","f":["На одной клетке Пуркинье бывает до 200 000 синапсов."],"wiki":"https://en.wikipedia.org/wiki/Purkinje_cell","v":{"t":"purkinje"},"w":0.0004,"h":0.0003636363636363636,"ph":{"src":"img/w_purk.jpg","w":611,"h":715,"artist":"","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:PurkinjeCell.jpg","wiki":"https://en.wikipedia.org/wiki/Purkinje_cell","file":"PurkinjeCell.jpg"}},{"id":"pyr","n":"Пирамидный нейрон","en":"Pyramidal neuron","c":"hum","d":"Главный возбуждающий нейрон коры: треугольное тело, длинный верхушечный дендрит и аксон. Получает тысячи синапсов.","f":["В коре человека около 16 миллиардов нейронов."],"sd":"тело ~20 мкм, дендриты до 0,5 мм и больше","wiki":"https://en.wikipedia.org/wiki/Pyramidal_cell","v":{"t":"neuron"},"w":0.0004,"h":0.0005,"ph":{"src":"img/w_pyr.jpg","w":409,"h":272,"artist":"The original uploader was Cahass at English Wikipedia.","license":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:GolgiStainedPyramidalCell.jpg","wiki":"https://en.wikipedia.org/wiki/Pyramidal_cell","file":"GolgiStainedPyramidalCell.jpg"}},{"id":"musc","n":"Волокно скелетной мышцы","en":"Skeletal muscle fiber","c":"hum","d":"Одна гигантская многоядерная клетка, слившаяся из сотен клеток-предшественников. Поперечная исчерченность — это ряды саркомеров.","f":["В одном волокне могут быть тысячи ядер."],"sd":"толщина 10–100 мкм, длина до нескольких сантиметров","wiki":"https://en.wikipedia.org/wiki/Skeletal_muscle","v":{"t":"muscle"},"w":0.03,"h":5.9999999999999995e-05,"ph":{"src":"img/w_musc.jpg","w":720,"h":656,"artist":"BruceBlaus","license":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:Blausen_0801_SkeletalMuscle.png","wiki":"https://en.wikipedia.org/wiki/Skeletal_muscle","file":"Blausen_0801_SkeletalMuscle.png"}},{"id":"mn","n":"Мотонейрон","en":"Motor neuron","c":"hum","d":"Нейрон спинного мозга, управляющий мышцами. Аксон мотонейрона, идущий к пальцам стопы, — самая длинная клетка тела.","f":["Толщина аксона — около 10–20 мкм, а длина около метра. В масштабе это садовый шланг длиной больше километра."],"sd":"аксон длиной около 1 м","wiki":"https://en.wikipedia.org/wiki/Motor_neuron","v":{"t":"motoneuron"},"w":1.0,"h":0.008333333333333333,"ph":{"src":"img/w_mn.jpg","w":720,"h":480,"artist":"Nephron","license":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Medulla_oblongata_-_posterior_-_cn_xii_-_very_high_mag.jpg","wiki":"https://en.wikipedia.org/wiki/Motor_neuron","file":"Medulla_oblongata_-_posterior_-_cn_xii_-_very_high_mag.jpg"}},{"id":"ehux","n":"Кокколитофорида","en":"Emiliania huxleyi","c":"pro","d":"Одноклеточная водоросль в панцире из меловых пластинок-кокколитов. Её цветения видно из космоса как бирюзовые пятна в океане.","f":["Белые скалы Дувра сложены из кокколитов древних кокколитофорид."],"wiki":"https://en.wikipedia.org/wiki/Emiliania_huxleyi","v":{"t":"cocco"},"w":5e-06,"h":5e-06,"ph":{"src":"img/w_ehux.jpg","w":311,"h":291,"artist":"Dr. Jeremy Young, University College London","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Emiliania_huxleyi.jpg","wiki":"https://en.wikipedia.org/wiki/Emiliania_huxleyi","file":"Emiliania_huxleyi.jpg"}},{"id":"chlorella","n":"Хлорелла","en":"Chlorella","c":"pro","d":"Шарик зелёной водоросли с одним чашевидным хлоропластом. Растёт очень быстро.","f":["В 1960-х хлореллу изучали как источник кислорода и пищи для космических полётов."],"wiki":"https://en.wikipedia.org/wiki/Chlorella","v":{"t":"chlorella"},"w":6e-06,"h":6e-06,"ph":{"src":"img/w_chlorella.jpg","w":720,"h":540,"artist":"ja:User:NEON / User:NEON_ja","license":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Chlorella_vulgaris_NIES2170.jpg","wiki":"https://en.wikipedia.org/wiki/Chlorella","file":"Chlorella_vulgaris_NIES2170.jpg"}},{"id":"plasmo","n":"Малярийный плазмодий","en":"Plasmodium (sporozoite)","c":"pro","d":"Одноклеточный паразит, которого переносят комары. Спорозоиты со слюной попадают в кровь, затем в печень, а потом заражают эритроциты.","f":["Малярия — одна из самых смертоносных болезней в истории человечества."],"sd":"спорозоит ~12 мкм","wiki":"https://en.wikipedia.org/wiki/Plasmodium","v":{"t":"sporozoite"},"w":1.2e-05,"h":1.5e-06,"ph":{"src":"img/w_plasmo.jpg","w":650,"h":650,"artist":"Image by Ute Frevert; false color by Margaret Shear.","license":"CC BY 2.5","page":"https://commons.wikimedia.org/wiki/File:Malaria.jpg","wiki":"https://en.wikipedia.org/wiki/Plasmodium","file":"Malaria.jpg"}},{"id":"giardia","n":"Лямблия","en":"Giardia duodenalis","c":"pro","d":"Кишечный паразит с двумя ядрами и присасывательным диском. Под микроскопом похожа на улыбающееся лицо.","f":["Её впервые описал Антони ван Левенгук в 1681 году — в собственном стуле."],"wiki":"https://en.wikipedia.org/wiki/Giardia_duodenalis","v":{"t":"giardia"},"w":9.8e-06,"h":1.4e-05,"ph":{"src":"img/w_giardia.jpg","w":612,"h":720,"artist":"CDC / Mahmud Tari","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Giardia_lamblia_SEM_8698_lores.jpg","wiki":"https://en.wikipedia.org/wiki/Giardia_duodenalis","file":"Giardia_lamblia_SEM_8698_lores.jpg"}},{"id":"chlamy","n":"Хламидомонада","en":"Chlamydomonas reinhardtii","c":"pro","d":"Одноклеточная водоросль с двумя жгутиками и красным глазком. Плывёт «брассом» на свет.","f":["Белки её глазка — каналородопсины — стали инструментом оптогенетики: ими включают нейроны светом."],"sd":"тело ~10 мкм, со жгутиками ~20 мкм","wiki":"https://en.wikipedia.org/wiki/Chlamydomonas_reinhardtii","v":{"t":"chlamy"},"w":1.4e-05,"h":2e-05,"ph":{"src":"img/w_chlamy.jpg","w":703,"h":720,"artist":"Dartmouth Electron Microscope Facility, Dartmouth College","license":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Chlamydomonas6-1.jpg","wiki":"https://en.wikipedia.org/wiki/Chlamydomonas_reinhardtii","file":"Chlamydomonas6-1.jpg"}},{"id":"tryp","n":"Трипаносома","en":"Trypanosoma brucei","c":"pro","d":"Возбудитель сонной болезни, переносимый мухой цеце. Постоянно меняет белковую «шубу», ускользая от иммунитета.","f":["Жгутик трипаносомы прикреплён к телу ундулирующей мембраной, поэтому она извивается штопором."],"wiki":"https://en.wikipedia.org/wiki/Trypanosoma_brucei","v":{"t":"trypano"},"w":2.5e-05,"h":5e-06,"ph":{"src":"img/w_tryp.jpg","w":720,"h":540,"artist":"Sue Vaughan","licen

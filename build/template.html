<title>Атлас масштабов жизни</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Интерактивная шкала размеров живого: от атома водорода до гигантской грибницы. Атомы, аминокислоты, белки, вирусы, клетки и организмы с 3D-моделями и фотографиями.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Oranienbaum&display=swap">
<style>
/* Layout: one full-bleed microscope stage (canvas) under floating instrument chrome;
   a slide-out specimen card on the right (bottom sheet on phones). Light = brightfield H&E slide,
   dark = fluorescence channels (DAPI / GFP / MitoTracker). */
:root{
  --bg:#f3f1f6; --bg2:#e9e5ef; --ink:#221b2f; --ink2:#62587a; --line:#d8d0e3;
  --panel:#fbfafc; --glass:rgba(251,250,252,.88); --accent:#6a3db3; --accent-ink:#ffffff; --accent-soft:#ece4f8;
  --font-display:"Oranienbaum","Didot","Bodoni 72","Times New Roman",serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
  /* stage stains */
  --k-bg:#f3f1f6; --k-grid:#8b7fa6; --k-ground:#6b5d86; --k-ink:#2a2138; --k-ink2:#6c6284;
  --k-mem:#9c3f70; --k-cyto:#f2c6d7; --k-cyto2:#e3a2bf; --k-nuc:#5b3c95; --k-nuc2:#3f2574; --k-nucl:#26134f;
  --k-gpos:#5a2c90; --k-gneg:#da5a8c; --k-green:#4d8c3b; --k-green2:#2e6826; --k-mito:#c95679; --k-mito2:#8e2c52;
  --k-vir:#56688c; --k-vir2:#97a5c4; --k-rna:#c0533a; --k-lipid:#efd38a; --k-red:#d4425a; --k-red2:#a42a42;
  --k-gold:#c98323; --k-silica:#4f8aa1; --k-sil:#3a3050; --k-golgi:#3a281d; --k-glow:#6a3db3;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#060914; --bg2:#0c1222; --ink:#e3e8f7; --ink2:#8e97b6; --line:#1d2742;
  --panel:#0a0f1f; --glass:rgba(9,13,27,.84); --accent:#47cfff; --accent-ink:#04121c; --accent-soft:#0f2638;
  --k-bg:#060914; --k-grid:#5d74b8; --k-ground:#7f93d0; --k-ink:#e3e8f7; --k-ink2:#8e97b6;
  --k-mem:#39e88b; --k-cyto:#0f3a2b; --k-cyto2:#15553f; --k-nuc:#2f5cff; --k-nuc2:#6f8fff; --k-nucl:#c3cfff;
  --k-gpos:#b27dff; --k-gneg:#ff5eae; --k-green:#ff4d4d; --k-green2:#ff8f80; --k-mito:#ff7a3c; --k-mito2:#ffb27e;
  --k-vir:#ffcc47; --k-vir2:#fff0a6; --k-rna:#ff5fd2; --k-lipid:#ffe26b; --k-red:#ff3d63; --k-red2:#ff8ba1;
  --k-gold:#ffb347; --k-silica:#6ff0ff; --k-sil:#c7d2f6; --k-golgi:#8affc0; --k-glow:#47cfff;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#060914; --bg2:#0c1222; --ink:#e3e8f7; --ink2:#8e97b6; --line:#1d2742;
  --panel:#0a0f1f; --glass:rgba(9,13,27,.84); --accent:#47cfff; --accent-ink:#04121c; --accent-soft:#0f2638;
  --k-bg:#060914; --k-grid:#5d74b8; --k-ground:#7f93d0; --k-ink:#e3e8f7; --k-ink2:#8e97b6;
  --k-mem:#39e88b; --k-cyto:#0f3a2b; --k-cyto2:#15553f; --k-nuc:#2f5cff; --k-nuc2:#6f8fff; --k-nucl:#c3cfff;
  --k-gpos:#b27dff; --k-gneg:#ff5eae; --k-green:#ff4d4d; --k-green2:#ff8f80; --k-mito:#ff7a3c; --k-mito2:#ffb27e;
  --k-vir:#ffcc47; --k-vir2:#fff0a6; --k-rna:#ff5fd2; --k-lipid:#ffe26b; --k-red:#ff3d63; --k-red2:#ff8ba1;
  --k-gold:#ffb347; --k-silica:#6ff0ff; --k-sil:#c7d2f6; --k-golgi:#8affc0; --k-glow:#47cfff;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{position:fixed;inset:0;overflow:hidden;overflow:clip}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#stage.hover{cursor:pointer}

/* top bar */
.bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
.bar>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand-name{font-family:var(--font-display);font-size:26px;line-height:1;letter-spacing:.01em;white-space:nowrap}
.brand-sub{font-family:var(--font-mono);font-size:11px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.bar-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px;flex:none}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.icon{width:36px;padding:0;justify-content:center}

/* chapter track */
.track{position:absolute;z-index:4;left:0;right:0;top:calc(58px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.track-row{position:relative;display:flex;gap:2px;height:8px;cursor:pointer;touch-action:none}
.seg{flex:1 1 0;border-radius:2px;background:var(--seg);opacity:.35;transition:opacity .2s}
.seg.on{opacity:1}
.track-marker{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);border-radius:1px;pointer-events:none;transform:translateX(-1px)}
.track-meta{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--ink2);letter-spacing:.04em}
.track-meta b{color:var(--ink);font-weight:600}

/* scale instruments */
.scale{position:absolute;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
  font-family:var(--font-mono);font-size:12px;color:var(--ink2);display:grid;gap:4px;pointer-events:none}
.scale-bar{height:6px;border:2px solid var(--ink);border-top:0;width:100px}
.scale-lbl{color:var(--ink);font-weight:600;font-size:13px}

/* caption */
.caption{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(640px,calc(100% - 2 * max(16px,env(safe-area-inset-left,0px))));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:14px 14px;transition:opacity .25s}
.caption.hide{opacity:0;pointer-events:none}
.nav-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav-btn svg{width:18px;height:18px}
.cap-body{min-width:0;display:grid;gap:2px}
.eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);min-width:0}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--chap,var(--accent));flex:none}
.eyebrow .chap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow .idx{margin-left:auto;white-space:nowrap}
.cap-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.cap-name{font-family:var(--font-display);font-size:34px;line-height:1.08;margin:2px 0 0;font-weight:400;text-wrap:balance}
.cap-size{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.cap-en{font-size:13px;color:var(--ink2);font-style:italic}
.cap-lead{margin:4px 0 0;font-size:14px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap-more{justify-self:start;margin-top:8px;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;cursor:pointer}

.hint{position:absolute;z-index:3;left:50%;top:calc(112px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:13px;color:var(--ink2);
  background:var(--glass);border:1px solid var(--line);padding:6px 14px;border-radius:999px;white-space:nowrap;transition:opacity .6s;pointer-events:none}
.hint.gone{opacity:0}

/* detail panel */
.panel{position:absolute;z-index:8;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;transform:translateX(102%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.panel.open{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s}
.p-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px 20px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);min-width:0}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--chap,var(--accent));flex:none}
.chip span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-nav{margin-left:auto;display:flex;gap:4px}
.p-nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center}
.p-nav button:hover{border-color:var(--accent)}
.p-nav svg{width:16px;height:16px}
.p-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 20px 28px;display:grid;grid-auto-rows:max-content;gap:18px;align-content:start}
.p-title h2{font-family:var(--font-display);font-weight:400;font-size:38px;line-height:1.05;margin:0;text-wrap:balance}
.p-en{color:var(--ink2);font-style:italic;font-size:14px;margin-top:4px}
.p-size{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px}
.p-size .v{font-family:var(--font-mono);font-weight:600;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.p-size .n{font-size:13px;color:var(--ink2)}
.media{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.m-tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:var(--bg2)}
.m-tabs button{flex:1;height:30px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink2)}
.m-tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.m-view{position:relative;height:300px}
.m-view>*{position:absolute;inset:0}
#v3d{touch-action:none}
#v3d canvas{outline:none}
.m-photo{margin:0;display:flex;flex-direction:column;background:#fff}
.m-photo img{flex:1;min-height:0;width:100%;object-fit:contain;background:#fff}
.m-photo figcaption{font-size:11px;color:#5d5470;padding:6px 10px;background:#f6f4f8;border-top:1px solid #e3dcec;line-height:1.35}
.m-photo figcaption a{color:inherit}
#mDraw{width:100%;height:100%;display:block}
.m-tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border-top:1px solid var(--line);background:var(--bg2);align-items:center}
.m-tools button{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12px}
.m-tools button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.m-tools .note{font-size:11.5px;color:var(--ink2);margin-left:auto}
.m-status{display:grid;place-items:center;font-size:13px;color:var(--ink2);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-family:var(--font-mono);font-size:11px;color:var(--ink2);padding:8px 10px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.p-desc{margin:0;font-size:15.5px;line-height:1.6;max-width:65ch}
.p-sec h3{margin:0 0 8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.facts li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.5}
.facts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--accent)}
.props{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;margin:0;font-size:14px}
.props dt{color:var(--ink2)}
.props dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
.codons{display:flex;flex-wrap:wrap;gap:4px}
.codons span{font-family:var(--font-mono);font-size:12px;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--ink)}
.cmp-list{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.cmp-list b{font-family:var(--font-mono);font-weight:600;color:var(--accent)}
.cmp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmp-row select{flex:1;min-width:0;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;padding:0 8px}
#cmpCanvas{width:100%;height:200px;display:block;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--bg)}
.cmp-text{font-size:14px;margin:8px 0 0}
.src{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}
.src a{color:var(--accent)}
.src .muted{color:var(--ink2)}

/* catalog */
.catalog{position:absolute;z-index:10;inset:0;background:var(--bg);display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.catalog.open{opacity:1;visibility:visible;transition:opacity .25s,visibility 0s}
.cat-head{display:grid;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.cat-top{display:flex;gap:10px;align-items:center}
.cat-top h2{font-family:var(--font-display);font-weight:400;font-size:30px;margin:0;line-height:1}
.cat-count{font-family:var(--font-mono);font-size:12px;color:var(--ink2)}
.cat-search{flex:1;min-width:0;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;padding:0 16px;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chips button{flex:none;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chips button i{width:7px;height:7px;border-radius:50%;background:var(--chap)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat-body{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.cat-group{margin-bottom:22px}
.cat-group h3{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.cat-group h3 i{width:10px;height:10px;border-radius:50%;background:var(--chap)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;text-align:left;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-width:0}
.card:hover{border-color:var(--accent)}
.card canvas{width:52px;height:52px;display:block}
.card b{display:block;font-weight:600;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.card small{font-family:var(--font-mono);font-size:11.5px;color:var(--ink2)}
.cat-empty{color:var(--ink2);padding:30px 0}

@media (max-width:860px){
  .brand-sub{display:none}
  .btn .lbl{display:none}
  .btn{width:36px;padding:0;justify-content:center}
}
@media (max-width:760px){
  .bar{gap:8px}
  .bar-actions{gap:4px}
  .btn,.btn.icon{width:34px;height:34px}
  .brand{min-width:0;flex:1 1 auto}
  .brand-name{font-size:17px;overflow:hidden;text-overflow:ellipsis}
  .track{top:calc(52px + env(safe-area-inset-top,0px))}
  .track-meta .blurb,#trackFov,#gridLbl{display:none}
  .scale{bottom:auto;top:calc(90px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px}
  .hint{top:calc(122px + env(safe-area-inset-top,0px));font-size:12px;white-space:normal;text-align:center;width:max-content;max-width:calc(100% - 32px)}
  .caption{grid-template-columns:1fr;padding:12px 14px}
  .caption .nav-btn{display:none}
  .cap-name{font-size:28px}
  .cap-lead{-webkit-line-clamp:2}
  .cap-actions{display:flex;gap:8px;align-items:center}
  .panel{top:auto;height:88%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(102%);padding-right:0}
  .p-title h2{font-size:32px}
  .m-view{height:260px}
}
.cap-actions{display:flex;gap:8px;align-items:center;margin-top:8px}
.cap-actions .cap-more{margin-top:0}
.cap-actions .mob{display:none}
@media (max-width:760px){ .cap-actions .mob{display:grid;width:32px;height:32px} }
@media (prefers-reduced-motion: reduce){ .panel,.catalog,.caption,.hint{transition:none} }
</style>

<div class="app" id="app">
  <canvas id="stage" role="img" aria-label="Шкала размеров живого: объекты, нарисованные в одном масштабе"></canvas>

  <header class="bar">
    <div class="brand"><span class="brand-name">Атлас масштабов жизни</span><span class="brand-sub" id="brandSub">от атома до грибницы</span></div>
    <div class="bar-actions">
      <button class="btn" id="btnCat" title="Каталог (/)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span class="lbl">Каталог</span></button>
